[package]
name = "freeremotedesk-windows"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
frd-app = { path = "../../crates/frd-app" }
frd-core = { path = "../../crates/frd-core" }
frd-media-api = { path = "../../crates/frd-media-api" }
frd-platform-api = { path = "../../crates/frd-platform-api" }
frd-platform-windows = { path = "../../crates/frd-platform-windows" }
frd-protocol-api = { path = "../../crates/frd-protocol-api" }
frd-protocol-apple = { path = "../../crates/frd-protocol-apple" }
frd-protocol-rdp = { path = "../../crates/frd-protocol-rdp" }
frd-shell-desktop = { path = "../../crates/frd-shell-desktop" }
frd-ui-model = { path = "../../crates/frd-ui-model" }
winit.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
ico = "0.4"
serde_json = "1"

[build-dependencies]
winresource = "0.1"
