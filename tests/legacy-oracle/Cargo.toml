[package]
name = "frd-legacy-original-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[dependencies]
ironrdp-graphics = "=0.9.0"
ironrdp-session = "=0.11.0"
ironrdp-pdu = "=0.9.0"
yuv = { version = "=0.8.17", features = ["rdp"] }
sha2 = "0.10"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
