[package]
name = "freeremotedesk"
version = "0.1.0"
edition = "2021"
description = "ARP 局域网发现 + VNC(RFB) 客户端，用于连接 macOS 屏幕共享（Screen Sharing）"

[workspace]
members = ["native/freeremote_ffi"]
resolver = "2"

[[bin]]
name = "freeremotedesk"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
des = { version = "0.8", optional = true }
png = { version = "0.17", optional = true }
num-bigint = { version = "0.4", optional = true }
md-5 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
pbkdf2 = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }
aes = { version = "0.8", optional = true }
ecb = { version = "0.1", optional = true }
cbc = { version = "0.1", optional = true }
sha1 = { version = "0.10", optional = true }
rsa = { version = "0.9", optional = true }
secrecy = "0.10"
crossbeam-channel = "0.5"
raw-window-handle = "0.6"
zeroize = "1"
egui = { version = "=0.36.1", default-features = false, features = ["default_fonts"], optional = true }
egui-winit = { version = "=0.36.1", default-features = false, optional = true }
egui-wgpu = { version = "=0.36.1", default-features = false, optional = true }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
getrandom = { version = "0.2", optional = true }
minifb = { version = "0.28", optional = true }
cpal = { version = "0.18.2", optional = true }
flate2 = { version = "1", optional = true }
fdk-aac = { version = "0.8", optional = true }
fdk-aac-sys = { version = "0.5", optional = true }

[dependencies.windows-sys]
version = "0.59"
optional = true
features = ["Win32_NetworkManagement_IpHelper"]

[features]
default = ["cli", "viewer"]
cli = [
    "dep:aes",
    "dep:anyhow",
    "dep:cbc",
    "dep:clap",
    "dep:des",
    "dep:ecb",
    "dep:fdk-aac",
    "dep:fdk-aac-sys",
    "dep:flate2",
    "dep:getrandom",
    "dep:hmac",
    "dep:md-5",
    "dep:num-bigint",
    "dep:pbkdf2",
    "dep:png",
    "dep:rsa",
    "dep:sha1",
    "dep:sha2",
    "dep:windows-sys",
]
viewer = ["cli", "dep:minifb", "dep:cpal"]
gui = [
    "viewer",
    "dep:bytemuck",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
    "dep:pollster",
    "dep:wgpu",
    "dep:winit",
]

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "wgsl"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal", "wgsl"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "wgsl"], optional = true }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland"], optional = true }

[profile.release]
lto = "thin"
