[package]
name = "freeremotedesk"
version = "0.1.0"
edition = "2021"
description = "ARP 局域网发现 + VNC(RFB) 客户端，用于连接 macOS 屏幕共享（Screen Sharing）"

[workspace]
resolver = "2"
members = [
    "crates/frd-core",
    "crates/frd-wire-rfb",
    "crates/frd-frame",
    "crates/frd-media-api",
    "crates/frd-video-ffmpeg",
    "crates/frd-video-ffmpeg-plugin",
    "crates/frd-protocol-api",
    "crates/frd-session",
    "crates/frd-ui-model",
    "crates/frd-platform-api",
    "crates/frd-app",
    "crates/frd-protocol-apple",
    "crates/frd-protocol-rdp",
    "crates/frd-render-wgpu",
    "crates/frd-compositor-wgpu",
    "crates/frd-platform-windows",
    "crates/frd-platform-macos",
    "crates/frd-ui-egui",
    "crates/frd-shell-desktop",
    "apps/freeremotedesk-windows",
    "apps/freeremotedesk-macos",
    "tools/frd-legacy-minifb-lab",
    "tools/frd-wgpu-smoke",
    "tools/frd-icon-assets",
    "tools/frd-video-capabilities",
]
exclude = ["third_party/ironrdp-egfx-0.3.0"]

[workspace.dependencies]
winit = "=0.30.13"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "dx12", "wgsl"] }
egui = "=0.36.1"
egui-winit = { version = "=0.36.1", default-features = false, features = ["accesskit"] }
egui-wgpu = { version = "=0.36.1", default-features = false }
raw-window-handle = "=0.6.2"

[patch.crates-io]
# IronRDP 0.10.0 accepts an EGFX DVC processor but does not expose the
# mandatory early capability bit that tells a server to open the graphics
# channel. Keep the patch local and minimal: the RDP adapter opts in only when
# an exact decoder provider is attached; legacy sessions retain upstream flags.
ironrdp-connector = { path = "third_party/ironrdp-connector-0.10.0" }
# The upstream client currently collapses AVC420's surface-coordinate region mask into
# one outer-rectangle update. Keep the pinned version local so this adapter can
# publish each validated region without changing the public renderer contract.
ironrdp-egfx = { path = "third_party/ironrdp-egfx-0.3.0" }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
des = "0.8"
png = "0.17"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
sha1 = "0.10"
getrandom = "0.2"
flate2 = "1"
fdk-aac = "0.8"
fdk-aac-sys = "0.5"
frd-wire-rfb = { path = "crates/frd-wire-rfb" }
frd-protocol-apple = { path = "crates/frd-protocol-apple" }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_NetworkManagement_IpHelper"]

[profile.release]
lto = "thin"
