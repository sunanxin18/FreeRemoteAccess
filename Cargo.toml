[package]
name = "freeremotedesk"
version = "0.1.0"
edition = "2021"
description = "纯 Rust 原生远程登录客户端，支持 RDP、Apple ARD 与 RFB/VNC"
license = "LicenseRef-Proprietary"

[workspace]
resolver = "2"

[package.metadata.deb]
name = "freeremoteaccess"
maintainer = "FreeRemoteAccess contributors"
copyright = "2026 FreeRemoteAccess contributors"
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/freeremotedesk", "usr/bin/freeremoteaccess", "755"],
    ["packaging/linux/freeremoteaccess.desktop", "usr/share/applications/freeremoteaccess.desktop", "644"],
    ["packaging/linux/freeremoteaccess.svg", "usr/share/icons/hicolor/scalable/apps/freeremoteaccess.svg", "644"],
    ["packaging/linux/io.freeremote.access.metainfo.xml", "usr/share/metainfo/io.freeremote.access.metainfo.xml", "644"],
]

[package.metadata.generate-rpm]
name = "freeremoteaccess"
assets = [
    { source = "target/release/freeremotedesk", dest = "/usr/bin/freeremoteaccess", mode = "755" },
    { source = "packaging/linux/freeremoteaccess.desktop", dest = "/usr/share/applications/freeremoteaccess.desktop", mode = "644" },
    { source = "packaging/linux/freeremoteaccess.svg", dest = "/usr/share/icons/hicolor/scalable/apps/freeremoteaccess.svg", mode = "644" },
    { source = "packaging/linux/io.freeremote.access.metainfo.xml", dest = "/usr/share/metainfo/io.freeremote.access.metainfo.xml", mode = "644" },
]

[[bin]]
name = "freeremotedesk"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
des = { version = "0.8", optional = true }
png = { version = "0.17", optional = true }
num-bigint = { version = "0.4", optional = true }
md-5 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
pbkdf2 = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }
ironrdp = { version = "=0.17.0", default-features = false, features = ["client", "connector", "input", "pdu", "rustls"], optional = true }
aes = { version = "0.8", optional = true }
ecb = { version = "0.1", optional = true }
cbc = { version = "0.1", optional = true }
sha1 = { version = "0.10", optional = true }
rsa = { version = "0.9", optional = true }
rpassword = { version = "=7.5.4", optional = true }
secrecy = "0.10"
crossbeam-channel = "0.5"
smallvec = { version = "1.15", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
hickory-resolver = { version = "=0.26.1", default-features = false, features = ["system-config", "tokio"] }
raw-window-handle = "0.6"
zeroize = "1"
egui = { version = "=0.36.1", default-features = false, features = ["default_fonts"], optional = true }
egui-winit = { version = "=0.36.1", default-features = false, optional = true }
egui-wgpu = { version = "=0.36.1", default-features = false, optional = true }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
getrandom = { version = "0.2", optional = true }
cpal = { version = "0.18.2", optional = true }
flate2 = { version = "1", optional = true }
fdk-aac = { version = "0.8", optional = true }
fdk-aac-sys = { version = "0.5", optional = true }

[dependencies.windows-sys]
version = "0.59"
optional = true
features = ["Win32_NetworkManagement_IpHelper"]

[features]
default = ["cli", "gui"]
cli = [
    "dep:aes",
    "dep:anyhow",
    "dep:cbc",
    "dep:clap",
    "dep:des",
    "dep:ecb",
    "dep:fdk-aac",
    "dep:fdk-aac-sys",
    "dep:flate2",
    "dep:getrandom",
    "dep:hmac",
    "dep:md-5",
    "dep:num-bigint",
    "dep:pbkdf2",
    "dep:png",
    "dep:rsa",
    "dep:rpassword",
    "dep:sha1",
    "dep:sha2",
    "dep:windows-sys",
]
media = ["cli", "dep:cpal"]
rdp = ["dep:ironrdp", "dep:smallvec"]
gui = [
    "cli",
    "media",
    "rdp",
    "dep:bytemuck",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
    "dep:pollster",
    "dep:wgpu",
    "dep:winit",
]

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "wgsl"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal", "wgsl"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "wgsl"], optional = true }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland"], optional = true }

[profile.release]
lto = "thin"

[patch.crates-io]
ironrdp-client = { path = "vendor/ironrdp-client" }
