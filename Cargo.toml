[package]
name = "freeremotedesk"
version = "0.1.0"
edition = "2021"
description = "ARP 局域网发现 + VNC(RFB) 客户端，用于连接 macOS 屏幕共享（Screen Sharing）"

[workspace]
resolver = "2"
members = [
    "crates/frd-core",
    "crates/frd-wire-rfb",
    "crates/frd-frame",
    "crates/frd-media-api",
    "crates/frd-protocol-api",
    "crates/frd-session",
    "crates/frd-ui-model",
    "crates/frd-platform-api",
    "crates/frd-app",
    "crates/frd-protocol-apple",
    "crates/frd-render-wgpu",
    "crates/frd-compositor-wgpu",
    "crates/frd-platform-windows",
    "crates/frd-ui-egui",
    "crates/frd-shell-desktop",
    "apps/freeremotedesk-windows",
    "tools/frd-legacy-minifb-lab",
    "tools/frd-wgpu-smoke",
    "tools/frd-icon-assets",
]

[workspace.dependencies]
winit = "=0.30.13"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "dx12", "wgsl"] }
egui = "=0.36.1"
egui-winit = { version = "=0.36.1", default-features = false, features = ["accesskit"] }
egui-wgpu = { version = "=0.36.1", default-features = false }
raw-window-handle = "=0.6.2"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
des = "0.8"
png = "0.17"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
sha1 = "0.10"
getrandom = "0.2"
flate2 = "1"
fdk-aac = "0.8"
fdk-aac-sys = "0.5"
frd-wire-rfb = { path = "crates/frd-wire-rfb" }
frd-protocol-apple = { path = "crates/frd-protocol-apple" }

[dependencies.windows-sys]
version = "0.59"
features = ["Win32_NetworkManagement_IpHelper"]

[profile.release]
lto = "thin"
