[package]
name = "frd-shell-ohos-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# 普通 HAP 的有界 RDP 互操作验证；默认不注册协议。
normal-hap-rdp-validation = ["dep:frd-protocol-rdp"]
native-presentation-fixture = []
normal-hap-codec-fixture = ["dep:frd-video-ffmpeg", "dep:sha2", "frd-video-ffmpeg/ohos-loader-diagnostics"]


# 显式验证包允许优化 Rust；默认关闭，不注册产品 codec。
normal-hap-codec-benchmark = ["dep:frd-video-ffmpeg", "dep:sha2", "frd-video-ffmpeg/ohos-loader-diagnostics"]
normal-hap-avc444-profile = ["dep:frd-video-ffmpeg", "dep:sha2", "frd-video-ffmpeg/ohos-loader-diagnostics"]
normal-hap-hevc444-profile = ["dep:frd-video-ffmpeg", "dep:sha2", "frd-video-ffmpeg/ohos-loader-diagnostics"]

[dependencies]
frd-protocol-rdp = { path = "../frd-protocol-rdp", optional = true }
frd-video-ffmpeg = { path = "../frd-video-ffmpeg", optional = true }
sha2 = { version = "0.10", optional = true }
frd-core = { path = "../frd-core" }
frd-frame = { path = "../frd-frame" }
frd-app = { path = "../frd-app" }
frd-ui-model = { path = "../frd-ui-model" }
frd-platform-api = { path = "../frd-platform-api" }
frd-platform-ohos = { path = "../frd-platform-ohos" }
frd-protocol-api = { path = "../frd-protocol-api" }
frd-media-api = { path = "../frd-media-api" }
frd-shell-runtime = { path = "../frd-shell-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[target.'cfg(target_env = "ohos")'.dependencies]
frd-render-wgpu = { path = "../frd-render-wgpu" }
frd-compositor-wgpu = { path = "../frd-compositor-wgpu" }
raw-window-handle.workspace = true
wgpu.workspace = true
pollster = "0.4"

[dev-dependencies]
frd-shell-runtime = { path = "../frd-shell-runtime", features = ["test-support"] }
wgpu.workspace = true
