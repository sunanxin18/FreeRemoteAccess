[package]
name = "frd-protocol-rdp"
version = "0.1.0"
edition = "2021"

[dependencies]
frd-core = { path = "../frd-core" }
frd-protocol-api = { path = "../frd-protocol-api" }
ironrdp = { version = "=0.17.0", default-features = false, features = ["connector", "session", "graphics", "input", "pdu"] }
ironrdp-blocking = "=0.10.0"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "=0.7.0"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
unicode-general-category = "1.1"
x509-cert = "0.2"
zeroize = "1"

[dev-dependencies]
frd-frame = { path = "../frd-frame" }
rcgen = "0.13"
