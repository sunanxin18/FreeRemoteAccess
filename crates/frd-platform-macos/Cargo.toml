[package]
name = "frd-platform-macos"
version = "0.1.0"
edition = "2021"

[dependencies]
frd-core = { path = "../frd-core" }
frd-media-api = { path = "../frd-media-api" }
frd-platform-api = { path = "../frd-platform-api" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
security-framework = "3.7"
