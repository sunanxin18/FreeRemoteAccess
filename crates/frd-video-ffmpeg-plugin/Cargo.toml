[package]
name = "frd-video-ffmpeg-plugin"
version = "0.1.0"
edition = "2021"

[lib]
name = "freeremotedesk_ffmpeg"
crate-type = ["cdylib", "rlib"]

[features]
default = []
native-ffmpeg = ["dep:ffmpeg-the-third"]

[dependencies]
frd-video-ffmpeg = { path = "../frd-video-ffmpeg" }
ffmpeg-the-third = { version = "=5.0.0", optional = true, default-features = false, features = ["codec"] }
