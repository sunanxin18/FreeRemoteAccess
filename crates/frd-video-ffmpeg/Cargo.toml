[package]
name = "frd-video-ffmpeg"
version = "0.1.0"
edition = "2021"

[features]
ohos-loader-diagnostics = []

[dependencies]
frd-core = { path = "../frd-core" }
frd-media-api = { path = "../frd-media-api" }
libloading = "=0.8.9"

[dev-dependencies]
libc = "0.2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(all(target_env = "ohos", target_arch = "aarch64"))'.dependencies]
libc = "0.2"
