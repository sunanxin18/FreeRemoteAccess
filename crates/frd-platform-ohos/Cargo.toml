[package]
name = "frd-platform-ohos"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
frd-core = { path = "../frd-core" }
frd-platform-api = { path = "../frd-platform-api" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
