[package]
name = "frd-platform-windows"
version = "0.1.0"
edition = "2021"

[dependencies]
frd-core = { path = "../frd-core" }
frd-media-api = { path = "../frd-media-api" }
frd-platform-api = { path = "../frd-platform-api" }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
cpal = "0.18.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
