[package]
name = "frd-protocol-apple"
version = "0.1.0"
edition = "2021"

[features]
mvs-profile = []
mvs-native-idct-arm64 = []
mvs-native-colors-arm64 = []
mvs-native-arm64 = ["mvs-native-idct-arm64", "mvs-native-colors-arm64"]

[dependencies]
anyhow = "1"
aes = "0.8"
cbc = "0.1"
ecb = "0.1"
fdk-aac = "0.8"
fdk-aac-sys = "0.5"
flate2 = "1"
getrandom = "0.2"
hmac = "0.12"
md-5 = "0.10"
num-bigint = "0.4"
pbkdf2 = "0.12"
rsa = "0.9"
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.6.1"
frd-core = { path = "../frd-core" }
frd-frame = { path = "../frd-frame" }
frd-media-api = { path = "../frd-media-api" }
frd-protocol-api = { path = "../frd-protocol-api" }
frd-wire-rfb = { path = "../frd-wire-rfb" }

[target.'cfg(unix)'.dev-dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Networking_WinSock"] }
