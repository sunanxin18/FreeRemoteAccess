[package]
name = "frd-platform-linux"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
frd-core = { path = "../frd-core" }
frd-platform-api = { path = "../frd-platform-api" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.1.0", default-features = false, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile = "3"
