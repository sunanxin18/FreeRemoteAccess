group = "io.freeremote.freeremote_native"
version = "1.0"

def repositoryRoot = file("${projectDir}/../../../..")
def rustJniLibs = file("${buildDir}/rustJniLibs")
def rustTargetDir = file("${buildDir}/cargo-target")

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "io.freeremote.freeremote_native"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specific NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion = android.ndkVersion

    sourceSets {
        main.jniLibs.srcDirs = [rustJniLibs]
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
    }
}

tasks.register("buildRustNative", Exec) {
    workingDir repositoryRoot
    environment "CARGO_TARGET_DIR", rustTargetDir.absolutePath
    commandLine "cargo", "ndk",
        "-t", "armeabi-v7a",
        "-t", "arm64-v8a",
        "-t", "x86_64",
        "-o", rustJniLibs.absolutePath,
        "build", "-p", "freeremote_ffi", "--release"
    inputs.files(
        file("${repositoryRoot}/Cargo.toml"),
        file("${repositoryRoot}/Cargo.lock"),
        file("${repositoryRoot}/src/app/connection.rs"),
        file("${repositoryRoot}/native/freeremote_ffi/Cargo.toml"),
        file("${repositoryRoot}/native/freeremote_ffi/src/lib.rs")
    )
    outputs.dir rustJniLibs
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("buildRustNative")
}
