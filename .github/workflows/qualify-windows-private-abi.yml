name: Windows ARM64 private compile objects

on:
  workflow_dispatch:
  # Root 必须先完成独立源码审查并放行；仅这个 workflow-file push 可首次注册/启动。
  push:
    branches:
      - codex/rdp-egfx-hevc-preference
    paths:
      - .github/workflows/qualify-windows-private-abi.yml

permissions:
  contents: read

jobs:
  compile-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run narrow source and container checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          mkdir "target/task4c5c3b2c-checks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -m unittest discover -s tools/tests -p test_compile_windows_private_abi.py -v \
            > "target/task4c5c3b2c-checks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/stdout.txt" \
            2> "target/task4c5c3b2c-checks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/stderr.txt"

      - name: Install exact pinned LLVM MinGW archive
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_SHA,GITHUB_REF,GITHUB_EVENT_NAME,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_OS,RUNNER_ARCH \
            python3 tools/compile-windows-private-abi.py install \
            --source-root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/target/task4c5c3b2c-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      # EXECFIX2 经独立复审：按固定 variant 验证实际 Rtl 导入，保留前两次失败材料。
      - name: Run narrow contract parser and orchestration checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir "target/task4c5c3b2e-checks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -B -m unittest discover -s tools/tests -p test_compile_windows_contract.py -v \
            > "target/task4c5c3b2e-checks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/stdout.txt" \
            2> "target/task4c5c3b2e-checks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/stderr.txt"

      - name: Compile three mandatory objects and five bad metadata candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/compile-windows-private-abi.py probe \
            --source-root "$GITHUB_WORKSPACE" \
            --installation "$GITHUB_WORKSPACE/target/task4c5c3b2c-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$GITHUB_WORKSPACE/target/task4c5c3b2c-compile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Compile five private C drivers and link matching ARM64 PE contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/compile-windows-contract.py \
            --source-root "$GITHUB_WORKSPACE" \
            --compile-input "$GITHUB_WORKSPACE/target/task4c5c3b2c-compile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --installation "$GITHUB_WORKSPACE/target/task4c5c3b2c-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$GITHUB_WORKSPACE/target/task4c5c3b2e-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Preserve exact checks and object evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-arm64-private-compile-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/task4c5c3b2c-checks-${{ github.run_id }}-${{ github.run_attempt }}/stdout.txt
            target/task4c5c3b2c-checks-${{ github.run_id }}-${{ github.run_attempt }}/stderr.txt
            target/task4c5c3b2c-install-${{ github.run_id }}-${{ github.run_attempt }}/evidence.zip
            target/task4c5c3b2c-install-${{ github.run_id }}-${{ github.run_attempt }}/archive.json
            target/task4c5c3b2c-install-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
            target/task4c5c3b2c-compile-${{ github.run_id }}-${{ github.run_attempt }}/evidence.zip
            target/task4c5c3b2c-compile-${{ github.run_id }}-${{ github.run_attempt }}/archive.json
            target/task4c5c3b2c-compile-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
            target/task4c5c3b2e-checks-${{ github.run_id }}-${{ github.run_attempt }}/
            target/task4c5c3b2e-contract-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
