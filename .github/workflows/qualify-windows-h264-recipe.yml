name: Windows H264 recipe A build-side evidence

on:
  workflow_dispatch:
    inputs:
      execute_release_a:
        description: Explicit root-authorized RELEASE A execution (single fixed recipe)
        type: boolean
        required: true
        default: false
  # 原自然run38847486035失败；诊断38849395836失败、38850194932成功，历史不归零。
  # 本次仅准备固定Execute恢复源码；下一自然调用尚未开始，push仍须root另审释放。
  # 不提供任意ref/tool/flags/retry；同一authority只调用原唯一自然builder。
  push:
    branches:
      - codex/rdp-egfx-hevc-preference
    paths:
      - .github/workflows/qualify-windows-h264-recipe.yml

permissions:
  contents: read

concurrency:
  group: windows-h264-recipe-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-a:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.execute_release_a == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/rdp-egfx-hevc-preference')
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RELEASE_A_EXECUTE: ${{ inputs.execute_release_a == true && 'true' || 'false' }}
      RELEASE_A_WORKFLOW_SHA: ${{ github.workflow_sha }}
      RELEASE_A_WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - name: Check out exactly this authorized source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute the single RELEASE A entry
        shell: pwsh
        run: pwsh -NoProfile -File tools/qualify-windows-h264-recipe-A.ps1 -Action Execute
      - name: Preserve all original materials and verify the transport
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File tools/qualify-windows-h264-recipe-A.ps1 -Action Collect
      - name: Upload exact POSIX transport, receipt and verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-a-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-a.tar
            ${{ runner.temp }}/release-a.receipt.json
            ${{ runner.temp }}/release-a.verification.json
          compression-level: 0
          if-no-files-found: error
      - name: Upload fixed Windows forensic originals on failure
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-a-bootstrap-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-a-bootstrap-diagnostic.json
            ${{ runner.temp }}/release-a-bootstrap-error.json
            ${{ runner.temp }}/release-a-bootstrap-diagnostic/host.json
            ${{ runner.temp }}/release-a-bootstrap-diagnostic/qualifier-source.ps1
            ${{ runner.temp }}/release-a-bootstrap-diagnostic/transport-source.py
            ${{ runner.temp }}/release-a-bootstrap-diagnostic/formatter/control.ps1
            ${{ runner.temp }}/release-a-bootstrap-diagnostic/formatter/historical.ps1
            ${{ runner.temp }}/release-a-bootstrap-diagnostic/formatter/results.json
            ${{ runner.temp }}/release-a-bootstrap-diagnostic/binary/control.ps1
            ${{ runner.temp }}/release-a-bootstrap-diagnostic/log-conflict/record-directory-conflict.bin
            ${{ runner.temp }}/release-a-bootstrap-diagnostic/initialize-success/root/provenance/state.json
            ${{ runner.temp }}/release-a-bootstrap-diagnostic/initialize-failure/preexisting-root-marker.bin
