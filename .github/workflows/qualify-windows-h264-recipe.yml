name: Windows H264 recipe A build-side evidence

on:
  workflow_dispatch:
    inputs:
      execute_release_a:
        description: Explicit root-authorized pre-WSL checkout diagnostic only
        type: boolean
        required: true
        default: false
  # 原自然38847486035/38851041806失败、两次bootstrap诊断历史均保留，不归零。
  # 此源码固定BootstrapCheckoutDiagnostic，在原fresh检查后/第一WSL前返回。
  # 不提供任意ref/tool/flags/retry；自然builder仍HOLD，prefix push须root另审释放。
  push:
    branches:
      - codex/rdp-egfx-hevc-preference
    paths:
      - .github/workflows/qualify-windows-h264-recipe.yml

permissions:
  contents: read

concurrency:
  group: windows-h264-recipe-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-a:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.execute_release_a == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/rdp-egfx-hevc-preference')
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RELEASE_A_EXECUTE: ${{ inputs.execute_release_a == true && 'true' || 'false' }}
      RELEASE_A_WORKFLOW_SHA: ${{ github.workflow_sha }}
      RELEASE_A_WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - name: Check out exactly this authorized source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run fixed pre-WSL checkout diagnostic only
        shell: pwsh
        run: pwsh -NoProfile -File tools/qualify-windows-h264-recipe-A.ps1 -Action BootstrapCheckoutDiagnostic
      - name: Preserve all original materials and verify the transport
        # pre-WSL prefix没有POSIX封包资格；原正式三件合同保留但当前不可达。
        if: ${{ false }}
        shell: pwsh
        run: pwsh -NoProfile -File tools/qualify-windows-h264-recipe-A.ps1 -Action Collect
      - name: Upload exact POSIX transport, receipt and verification
        if: ${{ false }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-a-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-a.tar
            ${{ runner.temp }}/release-a.receipt.json
            ${{ runner.temp }}/release-a.verification.json
          compression-level: 0
          if-no-files-found: error
      - name: Upload exact Windows pre-WSL forensic originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-a-bootstrap-checkout-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/release-a-bootstrap-error.json
            ${{ runner.temp }}/release-a-initialize/argv.json
            ${{ runner.temp }}/release-a-initialize/stdout.bin
            ${{ runner.temp }}/release-a-initialize/stderr.bin
            ${{ runner.temp }}/release-a-initialize/exit.json
            ${{ runner.temp }}/release-a-initialize/error.json
            ${{ runner.temp }}/release-a-initialize/executable.bin
            ${{ runner.temp }}/release-a-initialize/main-module.bin
            ${{ runner.temp }}/frd-release-a-evidence/provenance/state.json
            ${{ runner.temp }}/frd-release-a-evidence/provenance/checkout.json
            ${{ runner.temp }}/frd-release-a-evidence/setup/host.json
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/initialize/argv.json
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/initialize/stdout.bin
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/initialize/stderr.bin
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/initialize/exit.json
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/initialize/error.json
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/initialize/executable.bin
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/initialize/main-module.bin
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/checkout/argv.json
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/checkout/stdout.bin
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/checkout/stderr.bin
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/checkout/exit.json
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/checkout/error.json
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/checkout/executable.bin
            ${{ runner.temp }}/frd-release-a-evidence/setup/calls/checkout/main-module.bin
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/checkout-commands.json
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/git-executable.bin
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/blob-identities.json
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/attributes-before.bin
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/attributes.bin
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/check-attr.bin
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/.gitattributes
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/.github/workflows/qualify-windows-h264-recipe.yml
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/tools/qualify-windows-h264-recipe-A.ps1
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/tools/windows-h264-recipe-transport.py
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/tools/build-ffmpeg-windows.ps1
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/tools/desktop-ffmpeg-source.py
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/tools/ffmpeg-source-recipe.py
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/tools/windows-ffmpeg-bundle.py
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/tools/windows-ffmpeg-build-capture.py
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/tools/windows-ffmpeg-kernel.py
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/tools/ffmpeg-build-common.psm1
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/third_party/ffmpeg/8.1.2/h264-luma-dc-aarch64-recipe.json
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/third_party/ffmpeg/8.1.2/patches/0001-aarch64-h264-luma-dc-neon.patch
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/third_party/ffmpeg/8.1.2/LICENSE.LGPLv2.1
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/tools/tests/test_windows_h264_recipe_transport.py
            ${{ runner.temp }}/frd-release-a-evidence/checkout-inputs/tools/tests/windows-h264-recipe-ci.Tests.ps1
            ${{ runner.temp }}/frd-release-a-evidence/toolchain/windows/catalog.json
            ${{ runner.temp }}/frd-release-a-evidence/toolchain/windows/pwsh.bin
            ${{ runner.temp }}/frd-release-a-evidence/toolchain/windows/python.bin
            ${{ runner.temp }}/frd-release-a-evidence/toolchain/windows/wsl.exe.bin
