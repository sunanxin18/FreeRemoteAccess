name: Windows package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/freeremotedesk-windows/**"
      - "assets/**"
      - "crates/**"
      - "packaging/windows/**"
      - "third_party/ffmpeg/8.1.2/**"
      - "third_party/ironrdp-connector-0.10.0/**"
      - "tools/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches:
      - "main"
      - "codex/**"
    paths:
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/freeremotedesk-windows/**"
      - "assets/**"
      - "crates/**"
      - "packaging/windows/**"
      - "third_party/ffmpeg/8.1.2/**"
      - "third_party/ironrdp-connector-0.10.0/**"
      - "tools/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            rust_target: ""
            wsl_packages: "gcc-mingw-w64-x86-64"
            artifact_suffix: x86_64
          - architecture: x86
            rust_target: i686-pc-windows-msvc
            wsl_packages: "gcc-mingw-w64-i686"
            artifact_suffix: x86
          - architecture: arm64
            rust_target: aarch64-pc-windows-msvc
            wsl_packages: ""
            artifact_suffix: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify pinned Rust toolchain
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo --version --verbose
          $rustcVersion = (rustc --version).Split(' ')[1]
          if ($rustcVersion -cne '1.96.0') {
            throw "rust-toolchain.toml requires rustc 1.96.0; found $rustcVersion"
          }
          $rustTarget = '${{ matrix.rust_target }}'
          if ([string]::IsNullOrWhiteSpace($rustTarget)) {
            $rustTarget = 'x86_64-pc-windows-msvc'
          }
          rustup target add $rustTarget
          rustc --target $rustTarget --version --verbose

      - name: Enable Ubuntu 24.04 FFmpeg build environment
        shell: pwsh
        run: |
          wsl.exe --install --distribution Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { throw "WSL installation failed" }
          wsl.exe --distribution Ubuntu-24.04 --user root -- bash -lc "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y build-essential ${{ matrix.wsl_packages }} nasm pkg-config xz-utils curl ca-certificates"
          if ($LASTEXITCODE -ne 0) { throw "WSL dependency installation failed" }

      - name: Install pinned LLVM MinGW for Windows ARM64
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          # Ubuntu GCC MinGW packages do not target Windows ARM64.
          # Upstream release and asset digest: mstorsjo/llvm-mingw 20250709.
          $installScript = @'
          set -euo pipefail
          archive=/tmp/frd-llvm-mingw-20250709.tar.xz
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/mstorsjo/llvm-mingw/releases/download/20250709/llvm-mingw-20250709-msvcrt-ubuntu-22.04-x86_64.tar.xz -o "$archive"
          printf '%s  %s\n' 422f13915a41acd8b93566e590531f55d3de6e531575197d51756ff8e8d16525 "$archive" | sha256sum --check --strict
          mkdir -p /opt/frd-llvm-mingw-20250709
          tar -xJf "$archive" --strip-components=1 -C /opt/frd-llvm-mingw-20250709
          /opt/frd-llvm-mingw-20250709/bin/aarch64-w64-mingw32-clang --version
          printf '%s\n' 'int main(void) { return 0; }' > /tmp/frd-arm64-toolchain-smoke.c
          /opt/frd-llvm-mingw-20250709/bin/aarch64-w64-mingw32-clang /tmp/frd-arm64-toolchain-smoke.c -o /tmp/frd-arm64-toolchain-smoke.exe
          /opt/frd-llvm-mingw-20250709/bin/llvm-readobj --file-headers /tmp/frd-arm64-toolchain-smoke.exe | grep 'IMAGE_FILE_MACHINE_ARM64'
          '@
          # 写入无 BOM 的 LF 脚本，以直接 argv 执行，避免 Windows 换行和二次 shell 引号解析。
          $scriptPath = Join-Path $env:RUNNER_TEMP 'frd-install-llvm-mingw.sh'
          $scriptText = $installScript.Replace("`r`n", "`n").Replace("`r", "`n") + "`n"
          [IO.File]::WriteAllText($scriptPath, $scriptText, [Text.UTF8Encoding]::new($false))
          $wslScriptPath = & wsl.exe --distribution Ubuntu-24.04 --user root --exec wslpath -a $scriptPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($wslScriptPath)) {
            throw "Cannot resolve ARM64 toolchain installation script in WSL"
          }
          wsl.exe --distribution Ubuntu-24.04 --user root --exec bash --noprofile --norc ($wslScriptPath.Trim())
          if ($LASTEXITCODE -ne 0) { throw "Pinned Windows ARM64 toolchain verification failed" }

      - name: Build pinned FFmpeg bundle with native tests
        if: matrix.architecture == 'x86_64'
        shell: pwsh
        run: pwsh -NoProfile -File tools/build-ffmpeg-windows.ps1 -Configuration Release -Architecture x86_64 -WslDistribution Ubuntu-24.04 -RunNativeTests

      - name: Build pinned FFmpeg bundle for cross target
        if: matrix.architecture != 'x86_64'
        shell: pwsh
        run: pwsh -NoProfile -File tools/build-ffmpeg-windows.ps1 -Configuration Release -Architecture ${{ matrix.architecture }} -WslDistribution Ubuntu-24.04

      - name: Run host Rust tests (not target runtime evidence)
        shell: pwsh
        run: >-
          cargo test --locked
          -p frd-core
          -p frd-wire-rfb
          -p frd-frame
          -p frd-media-api
          -p frd-protocol-api
          -p frd-session
          -p frd-ui-model
          -p frd-app
          -p frd-protocol-apple
          -p frd-protocol-rdp
          -p frd-ui-egui
          -p frd-shell-desktop
          -p frd-video-ffmpeg
          -p frd-platform-windows
          -p freeremotedesk-windows

      - name: Run host plugin unit tests
        shell: pwsh
        run: cargo test --locked -p frd-video-ffmpeg-plugin --lib

      - name: Run x86 decoder fixtures in a 32-bit process
        if: matrix.architecture == 'x86'
        shell: pwsh
        run: |
          $env:FRD_FFMPEG_TEST_BUNDLE = (Resolve-Path '.codex-target/ffmpeg-8.1.2/windows-x86/Release/codec').Path
          cargo test --locked --target i686-pc-windows-msvc -p frd-video-ffmpeg-plugin --test main444_decode -- --nocapture

      - name: Compile ARM64 AAC with the target C++ backend
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          # 完整编译第三方 AAC，不能用宏检查代替真实 ARM64 汇编构建证据。
          clang-cl --version
          if ($LASTEXITCODE -ne 0) { throw "Windows ARM64 AAC requires clang-cl" }
          cargo build --locked --release --target aarch64-pc-windows-msvc -p fdk-aac-sys
          if ($LASTEXITCODE -ne 0) { throw "Windows ARM64 AAC compilation failed" }

      - name: Build Windows GUI release without implicit codec copying
        shell: pwsh
        run: |
          if ('${{ matrix.rust_target }}' -eq '') {
            cargo build --locked --release -p freeremotedesk-windows
          }
          else {
            cargo build --locked --release --target ${{ matrix.rust_target }} -p freeremotedesk-windows
          }

      - name: Stage Windows package
        shell: pwsh
        run: pwsh -NoProfile -File tools/stage-windows-package.ps1 -Architecture ${{ matrix.architecture }} -PackageRoot target/package-test

      - name: Verify Windows package
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-windows-package.ps1 -Architecture ${{ matrix.architecture }} -PackageRoot target/package-test

      - name: Run Windows package Pester tests
        if: matrix.architecture == 'x86_64'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Windows package tests require Windows PowerShell 5.1"
          }
          # GitHub's powershell wrapper injects ErrorActionPreference=Stop, but
          # these Pester 3 tests intentionally capture failing external commands.
          # -EnableExit remains the authoritative suite failure signal.
          $ErrorActionPreference = 'Continue'
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          if ((Get-Module Pester).Version -ne [Version]'3.4.0') {
            throw "Windows package tests require Pester 3.4.0"
          }
          Invoke-Pester -Script tools/tests/windows-package.Tests.ps1 -EnableExit

      - name: Upload exact Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeremotedesk-windows-package-${{ matrix.artifact_suffix }}
          path: target/package-test
          if-no-files-found: error

      - name: Upload exact corresponding FFmpeg source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          # The Actions artifact is a transport wrapper. No release is published here.
          name: freeremotedesk-ffmpeg-8.1.2-corresponding-source-${{ matrix.artifact_suffix }}
          path: target/release-assets/FreeRemoteDesk-ffmpeg-8.1.2-corresponding-source.zip
          if-no-files-found: error

  arm64-decoder-runtime:
    name: Windows ARM64 native decoder runtime
    needs: package
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Check out matching source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download this run's ARM64 package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: freeremotedesk-windows-package-arm64
          path: target/package-test

      - name: Verify native host and pinned Rust target
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne [Runtime.InteropServices.Architecture]::Arm64) {
            throw "ARM64 decoder runtime evidence requires an ARM64 Windows host"
          }
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "ARM64 Rust toolchain installation failed" }
          $rustcVersion = (rustc --version).Split(' ')[1]
          if ($rustcVersion -cne '1.96.0') { throw "Pinned Rust 1.96.0 required" }

      - name: Verify downloaded ARM64 package
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-windows-package.ps1 -Architecture arm64 -PackageRoot target/package-test

      - name: Decode fixtures with the packaged ARM64 DLLs
        shell: pwsh
        run: |
          $env:FRD_FFMPEG_TEST_BUNDLE = (Resolve-Path 'target/package-test/codecs/ffmpeg-8.1.2/windows-aarch64').Path
          cargo test --locked --target aarch64-pc-windows-msvc -p frd-video-ffmpeg-plugin --test main444_decode -- --nocapture
