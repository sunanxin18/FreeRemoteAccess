name: Linux client and FFmpeg packages

on:
  workflow_dispatch:
    inputs:
      target_architecture:
        description: "手动运行目标；all 保留三个 profile，aarch64 仅运行固定原生 ARM64 行"
        type: choice
        required: true
        default: all
        options:
          - all
          - aarch64
      arm64_source_recipe:
        description: "仅 Linux ARM64 的固定来源配方；x86/i686、AMD64 始终 upstream"
        type: choice
        required: true
        default: upstream
        options:
          - upstream
          - frd-h264dc-aarch64-v1
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/freeremotedesk-linux/**"
      - "crates/**"
      - "packaging/linux/**"
      - "assets/**"
      - "packaging/windows/licenses/**"
      - "tools/stage-linux-package.sh"
      - "tools/verify-linux-package.sh"
      - "third_party/ffmpeg/8.1.2/**"
      - "tools/build-ffmpeg-linux.sh"
      - "tools/ffmpeg-source-recipe.py"
      - "tools/desktop-ffmpeg-source.py"
      - "tools/linux-ffmpeg-bundle.py"
      - "tools/tests/test_linux_ffmpeg_recipe.py"
      - "tools/tests/generate_linux_kernel_fixture.py"
      - "tools/tests/fixtures/macos-h264dc-kernel*"
      - "tools/verify-linux-ffmpeg-bundle.sh"
      - "tools/qualify-linux-h264-recipe.*"
      - "tools/tests/test_linux_h264_qualification.py"
      - ".github/workflows/build-linux-ffmpeg.yml"
  push:
    branches:
      - "main"
      - "codex/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/freeremotedesk-linux/**"
      - "crates/**"
      - "packaging/linux/**"
      - "assets/**"
      - "packaging/windows/licenses/**"
      - "tools/stage-linux-package.sh"
      - "tools/verify-linux-package.sh"
      - "third_party/ffmpeg/8.1.2/**"
      - "tools/build-ffmpeg-linux.sh"
      - "tools/ffmpeg-source-recipe.py"
      - "tools/desktop-ffmpeg-source.py"
      - "tools/linux-ffmpeg-bundle.py"
      - "tools/tests/test_linux_ffmpeg_recipe.py"
      - "tools/tests/generate_linux_kernel_fixture.py"
      - "tools/tests/fixtures/macos-h264dc-kernel*"
      - "tools/verify-linux-ffmpeg-bundle.sh"
      - "tools/qualify-linux-h264-recipe.*"
      - "tools/tests/test_linux_h264_qualification.py"
      - ".github/workflows/build-linux-ffmpeg.yml"

permissions:
  contents: read

concurrency:
  group: linux-ffmpeg-${{ github.workflow }}-${{ github.ref }}
  # 完成长耗时原生验证；同组仅保留最新待运行提交。
  cancel-in-progress: false

jobs:
  bundle:
    name: Linux client and FFmpeg ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 只有手动明确 aarch64 选择固定单行；push/PR/default 继续原三个目标。
        # 用户字符串不会组成 runner、target 或 shell 命令。
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target_architecture == 'aarch64'
          && '[{"arch":"aarch64","runner":"ubuntu-24.04-arm","bundle_dir":"linux-aarch64","cargo_target":"aarch64-unknown-linux-gnu","cc":"","cross_prefix":""}]'
          || '[{"arch":"x86_64","runner":"ubuntu-24.04","bundle_dir":"linux-x86_64","cargo_target":"x86_64-unknown-linux-gnu","cc":"","cross_prefix":""},{"arch":"i686","runner":"ubuntu-24.04","bundle_dir":"linux-x86","cargo_target":"i686-unknown-linux-gnu","cc":"i686-linux-gnu-gcc","cross_prefix":"i686-linux-gnu-"},{"arch":"aarch64","runner":"ubuntu-24.04-arm","bundle_dir":"linux-aarch64","cargo_target":"aarch64-unknown-linux-gnu","cc":"","cross_prefix":""}]') }}
    env:
      FRD_FFMPEG_SOURCE_RECIPE: ${{ matrix.arch == 'aarch64' && inputs.arm64_source_recipe || 'upstream' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust target and native toolchains
        shell: bash
        run: |
          rustup target add "${{ matrix.cargo_target }}"
          if [[ "${{ matrix.arch }}" == i686 ]]; then
            sudo dpkg --add-architecture i386
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            nasm \
            xz-utils clang lld \
            pkg-config desktop-file-utils
          if [[ "${{ matrix.arch }}" != i686 ]]; then
            sudo apt-get install --no-install-recommends -y \
              libepoxy-dev libgtk-4-dev libwayland-dev libxkbcommon-dev libasound2-dev
          fi
          if [[ "${{ matrix.arch }}" == i686 ]]; then
            sudo apt-get install --no-install-recommends -y \
              gcc-i686-linux-gnu g++-i686-linux-gnu libc6-dev-i386-cross libc6-i386 lib32gcc-s1 libstdc++6:i386 \
              libwayland-dev:i386 libxkbcommon-dev:i386 libasound2-dev:i386 \
              libepoxy-dev:i386 libgtk-4-dev:i386
          fi

      - name: Verify pinned Rust toolchain
        shell: bash
        run: |
          test "$(rustc --version | cut -d' ' -f2)" = "1.96.0"
          rustc --target "${{ matrix.cargo_target }}" --version --verbose

      - name: Run native x86 publication parity and guarded ranges
        if: matrix.arch == 'x86_64' || matrix.arch == 'i686'
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          if [[ "${{ matrix.arch }}" == i686 ]]; then
            export CC_i686_unknown_linux_gnu=i686-linux-gnu-gcc
            export CXX_i686_unknown_linux_gnu=i686-linux-gnu-g++
            export CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=i686-linux-gnu-gcc
          fi
          target='${{ matrix.cargo_target }}'
          evidence="target/sse2-publication-native/$target"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          mkdir -p target/sse2-publication-native
          mkdir "$evidence"
          identity="$evidence/identity.log"
          executable="$evidence/rdp_publication_sse2"
          sources=(
            crates/frd-rdp-legacy-kernels/examples/rdp_publication_sse2.rs
            crates/frd-rdp-legacy-kernels/examples/support/rdp_publication_guard.rs
            crates/frd-protocol-rdp/src/pixel_convert/x86.rs
          )
          before=''
          runtime_complete=false
          finish_publication_evidence() {
            original_exit=$?
            trap - EXIT
            set +e
            after=$(sha256sum "${sources[@]}" 2>&1)
            hash_exit=$?
            final_exit=$original_exit
            if [[ $hash_exit -ne 0 || "$before" != "$after" ]]; then
              runtime_complete=false
              if [[ $final_exit -eq 0 ]]; then final_exit=1; fi
            fi
            executable_hash=''
            if [[ -f "$executable" ]]; then
              executable_hash=$(sha256sum "$executable" 2>&1)
              if [[ $? -ne 0 ]]; then
                runtime_complete=false
                if [[ $final_exit -eq 0 ]]; then final_exit=1; fi
              fi
            fi
            if ! {
              printf 'sources_after_sha256\n%s\n' "$after"
              printf 'executable_final_sha256\n%s\n' "$executable_hash"
              printf 'original_exit=%s final_exit=%s runtime_complete=%s\n' "$original_exit" "$final_exit" "$runtime_complete"
            } >> "$identity"; then
              if [[ $final_exit -eq 0 ]]; then final_exit=1; fi
              exit "$final_exit"
            fi
            exit "$final_exit"
          }
          trap finish_publication_evidence EXIT
          {
            printf 'target=%s arch=%s\n' "$target" '${{ matrix.arch }}'
            rustc -Vv
            uname -a
          } > "$identity"
          before=$(sha256sum "${sources[@]}")
          printf 'sources_before_sha256\n%s\n' "$before" >> "$identity"
          build=(cargo build --locked --release -p frd-rdp-legacy-kernels --example rdp_publication_sse2 --target "$target" -v)
          printf 'argv '; printf '%q ' "${build[@]}"; printf '\n'
          { printf 'build_argv '; printf '%q ' "${build[@]}"; printf '\n'; } >> "$identity"
          "${build[@]}" 2>&1 | tee "$evidence/build.log"
          cp "$CARGO_TARGET_DIR/$target/release/examples/rdp_publication_sse2" "$executable"
          { printf 'parity_argv '; printf '%q ' "$executable" parity; printf '\n'; } >> "$identity"
          "$executable" parity 2>&1 | tee "$evidence/parity.log"
          printf 'parity_exit=0\n' >> "$identity"
          { printf 'guards_argv '; printf '%q ' "$executable" guards; printf '\n'; } >> "$identity"
          "$executable" guards 2>&1 | tee "$evidence/guards.log"
          printf 'guards_exit=0\n' >> "$identity"
          runtime_complete=true

      - name: Retain exact x86 publication originals even on failure
        if: always() && (matrix.arch == 'x86_64' || matrix.arch == 'i686')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeremotedesk-linux-publication-${{ matrix.cargo_target }}
          # 部分原件可供失败复审，不能替代runtime_complete及两入口实际成功。
          path: |
            target/sse2-publication-native/${{ matrix.cargo_target }}/identity.log
            target/sse2-publication-native/${{ matrix.cargo_target }}/build.log
            target/sse2-publication-native/${{ matrix.cargo_target }}/parity.log
            target/sse2-publication-native/${{ matrix.cargo_target }}/guards.log
            target/sse2-publication-native/${{ matrix.cargo_target }}/rdp_publication_sse2
            crates/frd-rdp-legacy-kernels/examples/rdp_publication_sse2.rs
            crates/frd-rdp-legacy-kernels/examples/support/rdp_publication_guard.rs
            crates/frd-protocol-rdp/src/pixel_convert/x86.rs
          if-no-files-found: error

      - name: Build and run admitted private x86 direct ABI image
        if: matrix.arch == 'x86_64' || matrix.arch == 'i686'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, selectors, shutil, struct, subprocess, sys, time
          repo = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          target = '${{ matrix.cargo_target }}'
          if target not in ('x86_64-unknown-linux-gnu', 'i686-unknown-linux-gnu'):
              raise RuntimeError('Private ABI build requires the fixed Linux x86 targets')
          evidence = repo / 'target' / ('rdp-publication-abi-linux-' + target)
          cargo_output = repo / 'target' / ('rdp-publication-abi-linux-build-' + target)
          evidence.mkdir(exist_ok=False)
          identity_path = evidence / 'identity.json'
          # 人工冻结的最终已审图像；不从本次 build 自行刷新。
          allowed_sha256 = {
              'i686-unknown-linux-gnu': 'fb2817df08fc3683bef1a82f42fe37a0a7f4d6b0e36b21a1f380aea81a02e4d2',
              'x86_64-unknown-linux-gnu': 'b77c8f1a38de940267d58bcef4724b94529eda65203ddeda674c497e0f178875'}
          def stage_record(stage):
              return dict(stage=stage, argv=None, budget_seconds=900 if stage == 'build' else 30,
                  started=False, terminal_observed=False, timed_out=False, exit_code=None,
                  stdout_eof=False, stderr_eof=False, capture_complete=False, streams_closed=False,
                  cleanup=[], errors=[], failure_exit=0, validation='NOT_RUN')
          identity = dict(schema='frd-publication-direct-abi-exact-image-runtime-v1', commit=os.environ['GITHUB_SHA'],
              run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              job=os.environ['GITHUB_JOB'], target=target, host=os.uname().machine,
              required_rust='1.96.0', toolchain_precondition='preceding pinned toolchain step succeeded',
              runtime='NOT_RUN', runtime_complete=False, control_flow_protection='not-qualified', build_complete=False,
              admission=dict(scope='explicit-root-private-default-runner-test', expected_sha256=allowed_sha256[target],
                  actual_sha256=None, final_static_review_sha256='626ef2a0d69c08777bdee26c02d8c6c95fccdcf6465c0b40cf6daa767a8c2af9', passed=False),
              ownership_scope='direct Popen only', descendant_quiescence='NOT_PROVEN',
              linker_argv='not observed; Cargo -v is not the full actual linker argv',
              strip_status='not presumed; inherited release profile/config/environment',
              sources=[], configuration=[], tools=[], artifacts=[], errors=[],
              build=stage_record('build'), abi=stage_record('abi'), output_validation=dict(passed=False, expected_lines=28 if target.startswith('i686-') else 36, actual_lines=None, reason='NOT_RUN'))
          identity_path.write_text(json.dumps(identity, indent=2) + '\n')
          first_exit = 0
          first_failure = None
          def fail(message, code=1):
              global first_exit, first_failure
              identity['errors'].append(str(message))
              if first_exit == 0:
                  first_exit = code if 0 < code < 256 else 1
                  first_failure = str(message)
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          source_names = (
              ('crates/frd-rdp-legacy-kernels/examples/rdp_publication_abi.rs', 'source-rdp_publication_abi.rs'),
              ('crates/frd-rdp-legacy-kernels/examples/support/rdp_publication_abi_x64.rs', 'source-rdp_publication_abi_x64.rs'),
              ('crates/frd-rdp-legacy-kernels/examples/support/rdp_publication_abi_i686.rs', 'source-rdp_publication_abi_i686.rs'),
              ('crates/frd-protocol-rdp/src/pixel_convert/x86.rs', 'source-pixel_convert-x86.rs'))
          config_names = ('Cargo.toml', 'Cargo.lock', 'crates/frd-rdp-legacy-kernels/Cargo.toml',
              'rust-toolchain.toml', '.cargo/config.toml', '.github/workflows/build-linux-ffmpeg.yml')
          def expected_abi_lines(target):
              # 源码人工转录的固定三表；runtime 不读取源码来推导期望。
              state = [('sp_ret8', 0x00040000), ('df', 0x00080000), ('mxcsr', 0x00100000), ('x87cw', 0x00200000)]
              if target in ('i686-unknown-linux-gnu', 'i686-pc-windows-msvc'):
                  registers = [('ebx', 1), ('ebp', 2), ('esi', 4), ('edi', 8)]
              elif target in ('x86_64-unknown-linux-gnu', 'x86_64-pc-windows-msvc'):
                  registers = [('rbx', 1), ('rbp', 2), ('r12', 4), ('r13', 8), ('r14', 16), ('r15', 32)]
              else:
                  raise ValueError('Unknown ABI output target')
              controls = [(name + '_' + half, mask) for name, mask in registers for half in ('low', 'high')] + state
              if target == 'x86_64-pc-windows-msvc':
                  extra = [('rsi', 0x40), ('rdi', 0x80), ('xmm6', 0x100), ('xmm7', 0x200),
                      ('xmm8', 0x400), ('xmm9', 0x800), ('xmm10', 0x1000), ('xmm11', 0x2000),
                      ('xmm12', 0x4000), ('xmm13', 0x8000), ('xmm14', 0x10000), ('xmm15', 0x20000)]
                  controls += [(name + '_' + half, mask) for name, mask in extra for half in ('low', 'high')]
              lines = ['ABI_PRECONDITION protection_configuration=external-admission-required final_copyfn_chain=external-review-required']
              for kernel in ('sse2', 'ssse3'):
                  lines += [f'ABI_CALIBRATION kernel={kernel} case={name} exact_mask=0x{mask:08x}' for name, mask in controls]
                  lines += [f'ABI_VALID kernel={kernel} cases=9 exact_mask=0']
              lines += [f'ABI_OK scope=private-address-taken-normal-return controls_per_kernel={len(controls)} kernels=2 full_unwind=open shipping_fastcc_inline=open control_flow_protection=not-qualified protection_admission=external-required']
              return lines
          def validate_abi_bytes(target, raw, stderr):
              expected = expected_abi_lines(target)
              result = dict(passed=False, expected_lines=len(expected), actual_lines=None, reason=None)
              if stderr:
                  result['reason'] = 'successful ABI stderr must be empty'
                  return result
              try:
                  text = raw.decode('ascii')
              except UnicodeDecodeError:
                  result['reason'] = 'stdout is not ASCII'
                  return result
              if not text.endswith('\n') or '\x00' in text:
                  result['reason'] = 'missing final newline or NUL'
                  return result
              if '\r' in text:
                  text = text.replace('\r\n', '\n')
                  if '\r' in text or raw.count(b'\n') != raw.count(b'\r\n'):
                      result['reason'] = 'mixed or invalid newlines'
                      return result
              lines = text[:-1].split('\n')
              result['actual_lines'] = len(lines)
              result['passed'] = lines == expected
              result['reason'] = 'exact ordered closed output' if result['passed'] else 'stdout differs from exact ordered closed output'
              return result
          def capture(stage):
              # 只有两个固定命令，不能传 executable/argv 或覆盖预算。
              if stage == 'build':
                  argv = [cargo_path, 'rustc', '--locked', '--release', '-p', 'frd-rdp-legacy-kernels',
                      '--example', 'rdp_publication_abi', '--target', target, '-v', '--',
                      '-C', 'link-arg=-Wl,-Map,' + str(built_map)]
              elif stage == 'abi':
                  argv = [str(evidence / 'rdp_publication_abi'), 'abi']
              else:
                  raise ValueError('Unknown private ABI stage')
              record = identity[stage]
              record['argv'] = argv
              process = stdout_file = stderr_file = selector = None
              def stage_fail(message, code=1):
                  record['errors'].append(str(message))
                  if record['failure_exit'] == 0:
                      record['failure_exit'] = code if 0 < code < 256 else 1
              try:
                  # abi 两路空原件已在 build 前建立；不截断既有内容。
                  mode = 'xb' if stage == 'build' else 'r+b'
                  stdout_file = (evidence / (stage + '.stdout')).open(mode)
                  stderr_file = (evidence / (stage + '.stderr')).open(mode)
                  if stage == 'abi' and (os.fstat(stdout_file.fileno()).st_size or os.fstat(stderr_file.fileno()).st_size):
                      raise RuntimeError('Refusing nonempty pre-launch ABI raw streams')
                  identity_path.write_text(json.dumps(identity, indent=2) + '\n')
                  process = subprocess.Popen(argv, cwd=repo, env=build_env, stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  record['started'] = True
                  record['pid'] = process.pid
                  selector = selectors.DefaultSelector()
                  for name, pipe, output in (('stdout', process.stdout, stdout_file), ('stderr', process.stderr, stderr_file)):
                      os.set_blocking(pipe.fileno(), False)
                      selector.register(pipe, selectors.EVENT_READ, (name, output))
                  deadline = time.monotonic() + record['budget_seconds']
                  eof_deadline = None
                  while True:
                      code = process.poll()
                      now = time.monotonic()
                      if code is not None and not record['terminal_observed']:
                          record.update(terminal_observed=True, exit_code=code)
                          if code != 0 and record['failure_exit'] == 0:
                              record['failure_exit'] = code if 0 < code < 256 else 1
                          eof_deadline = now + 2
                      if record['terminal_observed'] and not selector.get_map():
                          break
                      if not record['terminal_observed'] and now >= deadline:
                          record['timed_out'] = True
                          stage_fail('Direct ' + stage + ' process exceeded fixed budget', 124)
                          break
                      if eof_deadline is not None and now >= eof_deadline:
                          stage_fail('Raw stream EOF remains unknown after 2s')
                          break
                      for key, _ in selector.select(0.05):
                          name, output = key.data
                          chunk = os.read(key.fileobj.fileno(), 65536)
                          if chunk:
                              output.write(chunk)
                          else:
                              record[name + '_eof'] = True
                              selector.unregister(key.fileobj)
              except Exception as error:
                  stage_fail(repr(error))
              finally:
                  # 只持有本 stage 的 Popen；不宣称后代或继承写端停止。
                  if process is not None and not record['terminal_observed']:
                      try:
                          process.kill()
                          record['cleanup'].append('direct kill returned')
                      except Exception as error:
                          stage_fail('direct kill: ' + repr(error))
                      try:
                          code = process.wait(timeout=1)
                          record.update(terminal_observed=True, exit_code=code)
                      except Exception as error:
                          stage_fail('direct reap within 1s: ' + repr(error))
                  if selector is not None:
                      try:
                          drain_deadline = time.monotonic() + 2
                          while selector.get_map() and time.monotonic() < drain_deadline:
                              for key, _ in selector.select(0.05):
                                  name, output = key.data
                                  chunk = os.read(key.fileobj.fileno(), 65536)
                                  if chunk:
                                      output.write(chunk)
                                  else:
                                      record[name + '_eof'] = True
                                      selector.unregister(key.fileobj)
                          if selector.get_map():
                              stage_fail('EOF unknown; inherited writer quiescence NOT_PROVEN')
                      except Exception as error:
                          stage_fail('raw capture finalization: ' + repr(error))
                      finally:
                          try:
                              selector.close()
                          except Exception as error:
                              stage_fail('selector close: ' + repr(error))
                  streams_closed = True
                  for stream in (process.stdout if process is not None else None,
                      process.stderr if process is not None else None, stdout_file, stderr_file):
                      if stream is not None:
                          try:
                              stream.close()
                          except Exception as error:
                              streams_closed = False
                              stage_fail('stream close: ' + repr(error))
                  record['streams_closed'] = streams_closed
                  record['capture_complete'] = (record['started'] and record['terminal_observed'] and
                      not record['timed_out'] and record['stdout_eof'] and record['stderr_eof'] and
                      streams_closed and not record['errors'])
                  if not record['capture_complete']:
                      stage_fail(stage + ' capture remained partial')
                  record['validation'] = 'native-exit-zero' if record['capture_complete'] and record['exit_code'] == 0 else 'FAILED'
              return record
          def verify_inputs(phase):
              if len(identity['sources']) != 4 or len(identity['configuration']) != len(config_names) or len(identity['artifacts']) != 2:
                  raise RuntimeError('Incomplete source/config/artifact identity at ' + phase)
              for row in identity['sources']:
                  current = dict(source=sha(repo / row['path']), snapshot=sha(evidence / row['snapshot']))
                  row[phase] = current
                  if row['before'] != current['source'] or row['before'] != current['snapshot']:
                      raise RuntimeError('Source or snapshot changed at ' + phase + ': ' + row['path'])
              for row in identity['configuration']:
                  row[phase] = sha(repo / row['path'])
                  if row['before'] != row[phase]:
                      raise RuntimeError('Configuration changed at ' + phase + ': ' + row['path'])
              for row in identity['artifacts']:
                  current = dict(build=sha(pathlib.Path(row['build_path'])), staged=sha(evidence / row['path']))
                  row[phase] = current
                  if len({row['build_sha256'], row['staged_sha256'], current['build'], current['staged']}) != 1:
                      raise RuntimeError('Artifact changed at ' + phase + ': ' + row['kind'])
          try:
              for name in ('abi.stdout', 'abi.stderr'):
                  (evidence / name).open('xb').close()
              cargo_output.mkdir(exist_ok=False)
              for name, snapshot in source_names:
                  before = sha(repo / name)
                  with (evidence / snapshot).open('xb') as output:
                      output.write((repo / name).read_bytes())
                  row = dict(path=name, snapshot=snapshot, before=before, snapshot_sha256=sha(evidence / snapshot))
                  identity['sources'].append(row)
                  if row['snapshot_sha256'] != before:
                      raise RuntimeError('Source snapshot mismatch: ' + name)
              for name in config_names:
                  identity['configuration'].append(dict(path=name, before=sha(repo / name)))
              # 仅精选编译变量；不收集环境全集或凭据。保留既有 i686 linker。
              build_env = os.environ.copy()
              if target == 'i686-unknown-linux-gnu':
                  build_env.update(CC_i686_unknown_linux_gnu='i686-linux-gnu-gcc',
                      CXX_i686_unknown_linux_gnu='i686-linux-gnu-g++',
                      CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER='i686-linux-gnu-gcc')
              build_env['CARGO_TARGET_DIR'] = str(cargo_output)
              names = ('RUSTUP_TOOLCHAIN', 'RUSTUP_HOME', 'CARGO_HOME', 'RUSTC', 'RUSTC_WRAPPER',
                  'RUSTC_WORKSPACE_WRAPPER', 'RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'CARGO_BUILD_TARGET',
                  'CARGO_PROFILE_RELEASE_LTO', 'CARGO_PROFILE_RELEASE_STRIP', 'CARGO_PROFILE_RELEASE_DEBUG',
                  'CARGO_PROFILE_RELEASE_CODEGEN_UNITS', 'CARGO_PROFILE_RELEASE_OPT_LEVEL',
                  'CARGO_PROFILE_RELEASE_PANIC', 'CARGO_TARGET_DIR',
                  'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER', 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS',
                  'CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER', 'CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_RUSTFLAGS',
                  'CC_i686_unknown_linux_gnu', 'CXX_i686_unknown_linux_gnu')
              identity['compilation_environment'] = {name: build_env.get(name) for name in names}
              for name in ('cargo', 'rustc'):
                  found = shutil.which(name)
                  if not found:
                      raise RuntimeError('Missing pinned Rust command: ' + name)
                  path = pathlib.Path(found).resolve()
                  identity['tools'].append(dict(command=name, path=str(path), sha256=sha(path),
                      identity_scope='resolved command file; may be rustup shim; pin checked by preceding step'))
              cargo_path = shutil.which('cargo')
              built_map = cargo_output / 'rdp_publication_abi.map'
              record = capture('build')
              if record['failure_exit']:
                  fail('Build native exit/capture failed: ' + str(record['exit_code']), record['failure_exit'])
              if first_exit == 0:
                  built = cargo_output / target / 'release/examples/rdp_publication_abi'
                  for kind, original, name in (('elf', built, 'rdp_publication_abi'), ('link_map', built_map, 'rdp_publication_abi.map')):
                      if original.stat().st_size == 0:
                          raise RuntimeError('Empty build artifact: ' + kind)
                      row = dict(kind=kind, build_path=str(original), path=name, build_sha256=sha(original), staged_sha256=None)
                      identity['artifacts'].append(row)
                      with (evidence / name).open('xb') as output:
                          output.write(original.read_bytes())
                      if kind == 'elf':
                          # 新建 staged 文件原本无执行位；只保留原 build mode，不修改图像字节。
                          shutil.copymode(original, evidence / name)
                          row['staged_mode'] = oct((evidence / name).stat().st_mode & 0o777)
                          if not ((evidence / name).stat().st_mode & 0o100):
                              raise RuntimeError('Staged ELF lacks owner execute mode')
                      row['staged_sha256'] = sha(evidence / name)
                      if row['build_sha256'] != row['staged_sha256']:
                          raise RuntimeError('Staged artifact mismatch: ' + kind)
                  header = (evidence / 'rdp_publication_abi').read_bytes()[:64]
                  expected_class, expected_machine = (1, 3) if target.startswith('i686-') else (2, 62)
                  if len(header) < 52 or header[:4] != b'\x7fELF' or header[4] != expected_class or header[5] != 1:
                      raise RuntimeError('ELF class/endianness mismatch')
                  machine = struct.unpack_from('<H', header, 18)[0]
                  if machine != expected_machine:
                      raise RuntimeError('ELF machine mismatch')
                  identity['elf_header'] = dict(elf_class=header[4], machine=machine, data=header[5])
                  verify_inputs('after_build')
                  identity['build_complete'] = True
                  identity['build']['validation'] = 'native-exit-zero-and-build-identities'
          except Exception as error:
              fail(repr(error))
          if not identity['build_complete'] and first_exit == 0:
              fail('Build evidence remained partial')
          try:
              if identity['build_complete'] and first_exit == 0:
                  verify_inputs('before_abi')
                  actual_sha256 = sha(evidence / 'rdp_publication_abi')
                  identity['admission']['actual_sha256'] = actual_sha256
                  if actual_sha256 != allowed_sha256[target]:
                      raise RuntimeError('Exact reviewed staged ELF SHA mismatch; runtime NOT_RUN; no automatic admission refresh')
                  identity['admission']['passed'] = True
                  identity['runtime'] = 'PARTIAL'
                  record = capture('abi')
                  if record['failure_exit']:
                      if record['exit_code'] == 77:
                          identity['runtime'] = 'UNAVAILABLE'
                      fail('ABI native exit/capture failed: ' + str(record['exit_code']), record['failure_exit'])
                  if record['capture_complete'] and record['exit_code'] == 0:
                      identity['output_validation'] = validate_abi_bytes(target,
                          (evidence / 'abi.stdout').read_bytes(), (evidence / 'abi.stderr').read_bytes())
                      if not identity['output_validation']['passed']:
                          record['validation'] = 'FAILED'
                          fail(identity['output_validation']['reason'])
                      else:
                          record['validation'] = 'exact-closed-output'
                  verify_inputs('after_abi')
                  identity['runtime_complete'] = (first_exit == 0 and record['capture_complete'] and
                      record['exit_code'] == 0 and identity['output_validation']['passed'])
                  if identity['runtime_complete']:
                      identity['runtime'] = 'PASS'
          except Exception as error:
              fail(repr(error))
          if identity['runtime'] == 'NOT_RUN':
              identity['abi']['skip_reason'] = first_failure or 'build or exact-image gate did not complete'
          if not identity['runtime_complete'] and first_exit == 0:
              fail('Private exact-image ABI runtime remained partial')
          identity['first_failure'] = first_failure
          identity['step_exit'] = first_exit
          try:
              pending = evidence / 'identity.pending.json'
              with pending.open('x') as output:
                  output.write(json.dumps(identity, indent=2) + '\n')
              pending.replace(identity_path)
          except Exception as error:
              fail('identity finalization: ' + repr(error))
              print('Identity finalization failed: ' + repr(error), file=sys.stderr)
          if first_exit:
              print('Private exact-image ABI failed: ' + '; '.join(identity['errors']), file=sys.stderr)
          sys.exit(first_exit)
          PY

      - name: Upload exact Linux direct ABI exact-image runtime originals
        if: always() && (matrix.arch == 'x86_64' || matrix.arch == 'i686')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-rdp-publication-abi-exact-image-runtime-${{ matrix.cargo_target }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            target/rdp-publication-abi-linux-${{ matrix.cargo_target }}/source-rdp_publication_abi.rs
            target/rdp-publication-abi-linux-${{ matrix.cargo_target }}/source-rdp_publication_abi_x64.rs
            target/rdp-publication-abi-linux-${{ matrix.cargo_target }}/source-rdp_publication_abi_i686.rs
            target/rdp-publication-abi-linux-${{ matrix.cargo_target }}/source-pixel_convert-x86.rs
            target/rdp-publication-abi-linux-${{ matrix.cargo_target }}/rdp_publication_abi
            target/rdp-publication-abi-linux-${{ matrix.cargo_target }}/rdp_publication_abi.map
            target/rdp-publication-abi-linux-${{ matrix.cargo_target }}/identity.json
            target/rdp-publication-abi-linux-${{ matrix.cargo_target }}/build.stdout
            target/rdp-publication-abi-linux-${{ matrix.cargo_target }}/build.stderr
            target/rdp-publication-abi-linux-${{ matrix.cargo_target }}/abi.stdout
            target/rdp-publication-abi-linux-${{ matrix.cargo_target }}/abi.stderr

      - name: Prove frozen original x86 publication counterexample
        if: matrix.arch == 'x86_64' || matrix.arch == 'i686'
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          target='${{ matrix.cargo_target }}'
          fixture=crates/frd-protocol-rdp/tests/fixtures/sse2-publication-red
          evidence="target/sse2-publication-red/$target"
          mkdir -p target/sse2-publication-red
          mkdir "$evidence"
          identity="$evidence/identity.log"
          executable="$evidence/publication-red"
          sources=("$fixture/host_controls.rs" "$fixture/pixel_convert.rs" "$fixture/pixel_convert/x86.rs" "$fixture/SHA256SUMS")
          before=''
          compile_exit=not-run
          run_exit=not-run
          strict_verdict=not-accepted
          finish_publication_red_evidence() {
            original_exit=$?
            trap - EXIT
            set +e
            after=$(sha256sum "${sources[@]}" 2>&1)
            hash_exit=$?
            final_exit=$original_exit
            if [[ $hash_exit -ne 0 || "$before" != "$after" ]]; then
              strict_verdict=not-accepted
              if [[ $final_exit -eq 0 ]]; then final_exit=1; fi
            fi
            executable_hash=''
            if [[ -f "$executable" ]]; then
              executable_hash=$(sha256sum "$executable" 2>&1)
              if [[ $? -ne 0 ]]; then
                strict_verdict=not-accepted
                if [[ $final_exit -eq 0 ]]; then final_exit=1; fi
              fi
            fi
            if ! {
              printf 'fixture_after_sha256\n%s\n' "$after"
              printf 'executable_final_sha256\n%s\n' "$executable_hash"
              printf 'compile_exit=%s run_exit=%s strict_verdict=%s original_exit=%s final_exit=%s\n' "$compile_exit" "$run_exit" "$strict_verdict" "$original_exit" "$final_exit"
            } >> "$identity"; then
              if [[ $final_exit -eq 0 ]]; then final_exit=1; fi
              exit "$final_exit"
            fi
            exit "$final_exit"
          }
          trap finish_publication_red_evidence EXIT
          { printf 'target=%s arch=%s\n' "$target" '${{ matrix.arch }}'; rustc -Vv; uname -a; } > "$identity"
          before=$(sha256sum "${sources[@]}")
          printf 'fixture_before_sha256\n%s\n' "$before" >> "$identity"
          manifest_hash=$(sha256sum "$fixture/SHA256SUMS")
          test "${manifest_hash%% *}" = 71b38ac579fdf1d7bf8566b2da48fdcc6a326cd1d6e4fd9dbc832886db5aa86a
          (cd "$fixture" && sha256sum --check --strict SHA256SUMS) >> "$identity" 2>&1
          compile=(rustc --edition=2021 --test "$fixture/host_controls.rs" --target "$target" -Copt-level=3 -Ccodegen-units=1)
          if [[ "${{ matrix.arch }}" == i686 ]]; then compile+=(-Clinker=i686-linux-gnu-gcc); fi
          compile+=(-o "$executable")
          { printf 'compile_argv '; printf '%q ' "${compile[@]}"; printf '\n'; } >> "$identity"
          set +e
          "${compile[@]}" > "$evidence/compile.stdout.log" 2> "$evidence/compile.stderr.log"
          compile_exit=$?
          set -e
          printf 'compile_exit=%s\n' "$compile_exit" >> "$identity"
          if [[ $compile_exit -ne 0 ]]; then exit "$compile_exit"; fi
          test -x "$executable"
          name=pixel_convert::tests::publication_actual_sse2_dispatch_when_ssse3_denied
          run=("$executable" --exact "$name" --nocapture --test-threads=1)
          { printf 'run_argv '; printf '%q ' "${run[@]}"; printf '\n'; } >> "$identity"
          set +e
          "${run[@]}" > "$evidence/run.stdout.log" 2> "$evidence/run.stderr.log"
          run_exit=$?
          set -e
          printf 'run_exit=%s\n' "$run_exit" >> "$identity"
          test "$run_exit" -eq 101
          stdout="$evidence/run.stdout.log"
          stderr="$evidence/run.stderr.log"
          count=$(grep -Fxc 'running 1 test' "$stdout"); test "$count" -eq 1
          count=$(grep -Ec '^running ' "$stdout"); test "$count" -eq 1
          count=$(grep -Fxc "test $name ... FAILED" "$stdout"); test "$count" -eq 1
          count=$(grep -Ec '^test [^ ]+ \.\.\.' "$stdout"); test "$count" -eq 1
          count=$(grep -Fxc "    $name" "$stdout"); test "$count" -eq 1
          count=$(grep -Ec '^test result:' "$stdout"); test "$count" -eq 1
          count=$(grep -Ec '^test result: FAILED\. 0 passed; 1 failed; 0 ignored; 0 measured; 9 filtered out; finished in ' "$stdout"); test "$count" -eq 1
          count=$(grep -Fc "panicked at $fixture/pixel_convert.rs:195:" "$stderr"); test "$count" -eq 1
          count=$(grep -Fc 'panicked at ' "$stderr"); test "$count" -eq 1
          count=$(grep -Fxc 'assertion `left == right` failed: 像素相同仍不得让 SSE2-only publication 静默调用 scalar' "$stderr"); test "$count" -eq 1
          count=$(grep -Fxc '  left: 0' "$stderr"); test "$count" -eq 1
          count=$(grep -Fxc ' right: 1' "$stderr"); test "$count" -eq 1
          strict_verdict=accepted-original-counterexample

      - name: Retain frozen original publication counterexample evidence
        if: always() && (matrix.arch == 'x86_64' || matrix.arch == 'i686')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
