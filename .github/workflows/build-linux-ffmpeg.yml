name: Linux client and FFmpeg packages

on:
  workflow_dispatch:
    inputs:
      target_architecture:
        description: "手动运行目标；all 保留三个 profile，aarch64 仅运行固定原生 ARM64 行"
        type: choice
        required: true
        default: all
        options:
          - all
          - aarch64
      arm64_source_recipe:
        description: "仅 Linux ARM64 的固定来源配方；x86/i686、AMD64 始终 upstream"
        type: choice
        required: true
        default: upstream
        options:
          - upstream
          - frd-h264dc-aarch64-v1
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/freeremotedesk-linux/**"
      - "crates/**"
      - "packaging/linux/**"
      - "assets/**"
      - "packaging/windows/licenses/**"
      - "tools/stage-linux-package.sh"
      - "tools/verify-linux-package.sh"
      - "third_party/ffmpeg/8.1.2/**"
      - "tools/build-ffmpeg-linux.sh"
      - "tools/ffmpeg-source-recipe.py"
      - "tools/desktop-ffmpeg-source.py"
      - "tools/linux-ffmpeg-bundle.py"
      - "tools/tests/test_linux_ffmpeg_recipe.py"
      - "tools/tests/generate_linux_kernel_fixture.py"
      - "tools/tests/fixtures/macos-h264dc-kernel*"
      - "tools/verify-linux-ffmpeg-bundle.sh"
      - "tools/qualify-linux-h264-recipe.*"
      - "tools/tests/test_linux_h264_qualification.py"
      - ".github/workflows/build-linux-ffmpeg.yml"
  push:
    branches:
      - "main"
      - "codex/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/freeremotedesk-linux/**"
      - "crates/**"
      - "packaging/linux/**"
      - "assets/**"
      - "packaging/windows/licenses/**"
      - "tools/stage-linux-package.sh"
      - "tools/verify-linux-package.sh"
      - "third_party/ffmpeg/8.1.2/**"
      - "tools/build-ffmpeg-linux.sh"
      - "tools/ffmpeg-source-recipe.py"
      - "tools/desktop-ffmpeg-source.py"
      - "tools/linux-ffmpeg-bundle.py"
      - "tools/tests/test_linux_ffmpeg_recipe.py"
      - "tools/tests/generate_linux_kernel_fixture.py"
      - "tools/tests/fixtures/macos-h264dc-kernel*"
      - "tools/verify-linux-ffmpeg-bundle.sh"
      - "tools/qualify-linux-h264-recipe.*"
      - "tools/tests/test_linux_h264_qualification.py"
      - ".github/workflows/build-linux-ffmpeg.yml"

permissions:
  contents: read

concurrency:
  group: linux-ffmpeg-${{ github.workflow }}-${{ github.ref }}
  # 完成长耗时原生验证；同组仅保留最新待运行提交。
  cancel-in-progress: false

jobs:
  bundle:
    name: Linux client and FFmpeg ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 只有手动明确 aarch64 选择固定单行；push/PR/default 继续原三个目标。
        # 用户字符串不会组成 runner、target 或 shell 命令。
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target_architecture == 'aarch64'
          && '[{"arch":"aarch64","runner":"ubuntu-24.04-arm","bundle_dir":"linux-aarch64","cargo_target":"aarch64-unknown-linux-gnu","cc":"","cross_prefix":""}]'
          || '[{"arch":"x86_64","runner":"ubuntu-24.04","bundle_dir":"linux-x86_64","cargo_target":"x86_64-unknown-linux-gnu","cc":"","cross_prefix":""},{"arch":"i686","runner":"ubuntu-24.04","bundle_dir":"linux-x86","cargo_target":"i686-unknown-linux-gnu","cc":"i686-linux-gnu-gcc","cross_prefix":"i686-linux-gnu-"},{"arch":"aarch64","runner":"ubuntu-24.04-arm","bundle_dir":"linux-aarch64","cargo_target":"aarch64-unknown-linux-gnu","cc":"","cross_prefix":""}]') }}
    env:
      FRD_FFMPEG_SOURCE_RECIPE: ${{ matrix.arch == 'aarch64' && inputs.arm64_source_recipe || 'upstream' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust target and native toolchains
        shell: bash
        run: |
          rustup target add "${{ matrix.cargo_target }}"
          if [[ "${{ matrix.arch }}" == i686 ]]; then
            sudo dpkg --add-architecture i386
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            nasm \
            xz-utils clang lld \
            pkg-config desktop-file-utils
          if [[ "${{ matrix.arch }}" != i686 ]]; then
            sudo apt-get install --no-install-recommends -y \
              libepoxy-dev libgtk-4-dev libwayland-dev libxkbcommon-dev libasound2-dev
          fi
          if [[ "${{ matrix.arch }}" == i686 ]]; then
            sudo apt-get install --no-install-recommends -y \
              gcc-i686-linux-gnu g++-i686-linux-gnu libc6-dev-i386-cross libc6-i386 lib32gcc-s1 libstdc++6:i386 \
              libwayland-dev:i386 libxkbcommon-dev:i386 libasound2-dev:i386 \
              libepoxy-dev:i386 libgtk-4-dev:i386
          fi

      - name: Verify pinned Rust toolchain
        shell: bash
        run: |
          test "$(rustc --version | cut -d' ' -f2)" = "1.96.0"
          rustc --target "${{ matrix.cargo_target }}" --version --verbose

      - name: Run native x86 publication parity and guarded ranges
        if: matrix.arch == 'x86_64' || matrix.arch == 'i686'
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          if [[ "${{ matrix.arch }}" == i686 ]]; then
            export CC_i686_unknown_linux_gnu=i686-linux-gnu-gcc
            export CXX_i686_unknown_linux_gnu=i686-linux-gnu-g++
            export CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=i686-linux-gnu-gcc
          fi
          target='${{ matrix.cargo_target }}'
          evidence="target/sse2-publication-native/$target"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          mkdir -p target/sse2-publication-native
          mkdir "$evidence"
          identity="$evidence/identity.log"
          executable="$evidence/rdp_publication_sse2"
          sources=(
            crates/frd-rdp-legacy-kernels/examples/rdp_publication_sse2.rs
            crates/frd-rdp-legacy-kernels/examples/support/rdp_publication_guard.rs
            crates/frd-protocol-rdp/src/pixel_convert/x86.rs
          )
          before=''
          runtime_complete=false
          finish_publication_evidence() {
            original_exit=$?
            trap - EXIT
            set +e
            after=$(sha256sum "${sources[@]}" 2>&1)
            hash_exit=$?
            final_exit=$original_exit
            if [[ $hash_exit -ne 0 || "$before" != "$after" ]]; then
              runtime_complete=false
              if [[ $final_exit -eq 0 ]]; then final_exit=1; fi
            fi
            executable_hash=''
            if [[ -f "$executable" ]]; then
              executable_hash=$(sha256sum "$executable" 2>&1)
              if [[ $? -ne 0 ]]; then
                runtime_complete=false
                if [[ $final_exit -eq 0 ]]; then final_exit=1; fi
              fi
            fi
            if ! {
              printf 'sources_after_sha256\n%s\n' "$after"
              printf 'executable_final_sha256\n%s\n' "$executable_hash"
              printf 'original_exit=%s final_exit=%s runtime_complete=%s\n' "$original_exit" "$final_exit" "$runtime_complete"
            } >> "$identity"; then
              if [[ $final_exit -eq 0 ]]; then final_exit=1; fi
              exit "$final_exit"
            fi
            exit "$final_exit"
          }
          trap finish_publication_evidence EXIT
          {
            printf 'target=%s arch=%s\n' "$target" '${{ matrix.arch }}'
            rustc -Vv
            uname -a
          } > "$identity"
          before=$(sha256sum "${sources[@]}")
          printf 'sources_before_sha256\n%s\n' "$before" >> "$identity"
          build=(cargo build --locked --release -p frd-rdp-legacy-kernels --example rdp_publication_sse2 --target "$target" -v)
          printf 'argv '; printf '%q ' "${build[@]}"; printf '\n'
          { printf 'build_argv '; printf '%q ' "${build[@]}"; printf '\n'; } >> "$identity"
          "${build[@]}" 2>&1 | tee "$evidence/build.log"
          cp "$CARGO_TARGET_DIR/$target/release/examples/rdp_publication_sse2" "$executable"
          { printf 'parity_argv '; printf '%q ' "$executable" parity; printf '\n'; } >> "$identity"
          "$executable" parity 2>&1 | tee "$evidence/parity.log"
          printf 'parity_exit=0\n' >> "$identity"
          { printf 'guards_argv '; printf '%q ' "$executable" guards; printf '\n'; } >> "$identity"
          "$executable" guards 2>&1 | tee "$evidence/guards.log"
          printf 'guards_exit=0\n' >> "$identity"
          runtime_complete=true

      - name: Retain exact x86 publication originals even on failure
        if: always() && (matrix.arch == 'x86_64' || matrix.arch == 'i686')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeremotedesk-linux-publication-${{ matrix.cargo_target }}
          # 部分原件可供失败复审，不能替代runtime_complete及两入口实际成功。
          path: |
            target/sse2-publication-native/${{ matrix.cargo_target }}/identity.log
            target/sse2-publication-native/${{ matrix.cargo_target }}/build.log
            target/sse2-publication-native/${{ matrix.cargo_target }}/parity.log
            target/sse2-publication-native/${{ matrix.cargo_target }}/guards.log
            target/sse2-publication-native/${{ matrix.cargo_target }}/rdp_publication_sse2
            crates/frd-rdp-legacy-kernels/examples/rdp_publication_sse2.rs
            crates/frd-rdp-legacy-kernels/examples/support/rdp_publication_guard.rs
            crates/frd-protocol-rdp/src/pixel_convert/x86.rs
          if-no-files-found: error

      - name: Run target ClearCodec, NSCodec and Progressive parity and bounded benchmark
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.arch }}" == i686 ]]; then
            export CC_i686_unknown_linux_gnu=i686-linux-gnu-gcc
            export CXX_i686_unknown_linux_gnu=i686-linux-gnu-g++
            export CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=i686-linux-gnu-gcc
          fi
          printf 'ClearCodec runtime target=%s host=%s\n' "${{ matrix.cargo_target }}" "$(uname -m)"
          cargo test --locked --target "${{ matrix.cargo_target }}" -p frd-protocol-rdp clearcodec
          cargo test --locked --release --target "${{ matrix.cargo_target }}" -p frd-protocol-rdp bounded_decode_benchmark -- --ignored --nocapture --test-threads=1
          cargo test --locked --target "${{ matrix.cargo_target }}" -p frd-protocol-rdp progressive
          cargo test --locked --release --target "${{ matrix.cargo_target }}" -p frd-protocol-rdp benchmark_progressive_native_tile -- --ignored --nocapture --test-threads=1
          if [[ "${{ matrix.arch }}" == i686 ]]; then
            cargo test --locked --target "${{ matrix.cargo_target }}" -p frd-protocol-rdp --lib pixel_convert::tests:: -- --skip conversion_dispatch_benchmark_records_kernel_and_matches_reference --nocapture --test-threads=1
          fi

      - name: Build and verify exact FFmpeg bundle
        shell: bash
        env:
          FRD_FFMPEG_ARCH: ${{ matrix.arch }}
          FRD_FFMPEG_CC: ${{ matrix.cc }}
          FRD_FFMPEG_CROSS_PREFIX: ${{ matrix.cross_prefix }}
          FRD_CARGO_TARGET: ${{ matrix.cargo_target }}
          FRD_FFMPEG_RUN_TARGET_TESTS: "1"
        run: |
          if [[ "${{ matrix.arch }}" == aarch64 && "$FRD_FFMPEG_SOURCE_RECIPE" == frd-h264dc-aarch64-v1 ]]; then
            # 新门只接受不存在的 target/ffmpeg-linux；一次构建使用私有 Cargo 输出。
            bash tools/qualify-linux-h264-recipe.sh
          else
            bash tools/build-ffmpeg-linux.sh
          fi

      - name: Retain modified ARM64 runtime evidence even on failure
        if: always() && matrix.arch == 'aarch64' && env.FRD_FFMPEG_SOURCE_RECIPE == 'frd-h264dc-aarch64-v1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeremotedesk-linux-aarch64-frd-h264dc-aarch64-v1-runtime-evidence
          # 保留数值 executable/私有对象、全部窗口、实际 shipping 对象与独立原版源码。
          # 构建失败仍保留 terminal log；缺失证据不能抵消前一步失败。
          path: |
            target/ffmpeg-linux/runtime-evidence
            target/ffmpeg-linux/build.*/configuration.json
            target/ffmpeg-linux/build.*/kernel.json
            target/ffmpeg-linux/build.*/source
            target/ffmpeg-linux/build.*/dist
            target/ffmpeg-linux/upstream
            target/ffmpeg-linux/bundle/linux-aarch64
            target/ffmpeg-linux/ffmpeg-8.1.2.tar.xz
          if-no-files-found: error
          include-hidden-files: true

      - name: Verify Linux bundle ELF and plugin ABI
        shell: bash
        run: |
          bash tools/verify-linux-ffmpeg-bundle.sh \
            "target/ffmpeg-linux/bundle/${{ matrix.bundle_dir }}" "${{ matrix.bundle_dir }}"

      - name: Load Linux plugin and call ABI entry point
        if: matrix.arch != 'i686'
        shell: bash
        env:
          FRD_LINUX_FFMPEG_RUNTIME_SMOKE: "1"
        run: |
          bash tools/verify-linux-ffmpeg-bundle.sh \
            "target/ffmpeg-linux/bundle/${{ matrix.bundle_dir }}" "${{ matrix.bundle_dir }}"

      - name: Build and verify complete Linux client package
        shell: bash
        env:
          FRD_LINUX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.arch }}" == i686 ]]; then
            export CC_i686_unknown_linux_gnu=i686-linux-gnu-gcc
            export CXX_i686_unknown_linux_gnu=i686-linux-gnu-g++
            export CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=i686-linux-gnu-gcc
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
          fi
          FRD_FFMPEG_TEST_ARCHIVE=target/ffmpeg-linux/ffmpeg-8.1.2.tar.xz \
            python3 -B -m unittest discover -s packaging/linux -p 'test_*.py'
          cargo test --locked --target "${{ matrix.cargo_target }}" -p freeremotedesk-linux
          bash tools/stage-linux-package.sh release
          FRD_LINUX_PACKAGE_RUNTIME_SMOKE=1 bash tools/verify-linux-package.sh \
            "target/linux/release/${{ matrix.bundle_dir }}/FreeRemoteDesk" "${{ matrix.bundle_dir }}"

      - name: Archive complete Linux client preserving executable permissions
        shell: bash
        run: |
          mkdir -p target/release-assets
          tar -C "target/linux/release/${{ matrix.bundle_dir }}" -czf \
            "target/release-assets/FreeRemoteDesk-${{ matrix.bundle_dir }}-${{ env.FRD_FFMPEG_SOURCE_RECIPE }}.tar.gz" FreeRemoteDesk

      - name: Upload complete Linux client package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeremotedesk-client-${{ matrix.bundle_dir }}-${{ env.FRD_FFMPEG_SOURCE_RECIPE }}
          path: target/release-assets/FreeRemoteDesk-${{ matrix.bundle_dir }}-${{ env.FRD_FFMPEG_SOURCE_RECIPE }}.tar.gz
          if-no-files-found: error

      - name: Stage corresponding FFmpeg source evidence
        shell: bash
        run: |
          source_root="target/ffmpeg-linux"
          release_root="target/release-assets/ffmpeg-8.1.2-${{ matrix.arch }}-$FRD_FFMPEG_SOURCE_RECIPE"
          test -f "$source_root/ffmpeg-8.1.2.tar.xz"
          actual_hash="$(sha256sum "$source_root/ffmpeg-8.1.2.tar.xz" | awk '{print $1}')"
          test "$actual_hash" = "464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c"
          mkdir -p "$release_root"
          if [[ "$FRD_FFMPEG_SOURCE_RECIPE" == upstream ]]; then
            cp "$source_root/ffmpeg-8.1.2.tar.xz" "$release_root/"
            cp third_party/ffmpeg/8.1.2/LICENSE.LGPLv2.1 third_party/ffmpeg/8.1.2/changes.diff "$release_root/"
            {
              printf 'architecture=%s\n' "${{ matrix.arch }}"
              printf 'recipe=upstream\narchive_sha256=%s\n' "$actual_hash"
              printf 'source_sha256_expected=464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c\n'
              printf 'local_changes=changes.diff\n'
            } > "$release_root/SOURCE-MANIFEST.txt"
          else
            asset_name=$(python3 tools/desktop-ffmpeg-source.py asset-name \
              --profile "${{ matrix.bundle_dir }}" --source-recipe "$FRD_FFMPEG_SOURCE_RECIPE")
            python3 tools/desktop-ffmpeg-source.py verify-asset \
              --profile "${{ matrix.bundle_dir }}" --source-recipe "$FRD_FFMPEG_SOURCE_RECIPE" \
              --archive "$source_root/ffmpeg-8.1.2.tar.xz" \
              --output "$source_root/bundle/${{ matrix.bundle_dir }}/$asset_name"
            cp "$source_root/bundle/${{ matrix.bundle_dir }}/$asset_name" "$release_root/"
          fi
          FRD_FFMPEG_TEST_ARCHIVE="$source_root/ffmpeg-8.1.2.tar.xz" \
            python3 -B -m unittest discover -s tools/tests -p test_linux_ffmpeg_recipe.py -v

      - name: Run host-side FFmpeg ABI tests
        shell: bash
        run: cargo test --locked -p frd-video-ffmpeg -p frd-video-ffmpeg-plugin

      - name: Upload exact Linux bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeremotedesk-ffmpeg-linux-${{ matrix.arch }}-${{ env.FRD_FFMPEG_SOURCE_RECIPE }}
          path: target/ffmpeg-linux/bundle/${{ matrix.bundle_dir }}
          if-no-files-found: error

      - name: Upload corresponding FFmpeg source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeremotedesk-ffmpeg-8.1.2-source-linux-${{ matrix.arch }}-${{ env.FRD_FFMPEG_SOURCE_RECIPE }}
          path: target/release-assets/ffmpeg-8.1.2-${{ matrix.arch }}-${{ env.FRD_FFMPEG_SOURCE_RECIPE }}
          if-no-files-found: error
