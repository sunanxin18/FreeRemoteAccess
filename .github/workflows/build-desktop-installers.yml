name: build-desktop-installers

on:
  workflow_dispatch:
  push:
    branches: [main, feat/five-platform-client]
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.96.0

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.14'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-25
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Install native and pinned security dependencies
        run: |
          sudo bash packaging/linux/install-ubuntu-jammy-snapshot.sh
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Verify supply chain policy
        run: |
          python packaging/check_rsa_usage.py --repo .
          python packaging/check_rsa_dependency_boundary.py --repo .
          cargo audit --deny yanked --ignore RUSTSEC-2023-0071
          cargo deny check
      - name: Verify Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets --features gui
          cargo build --locked --release --no-default-features --features gui
      - name: Verify packaging contracts
        run: python -m unittest discover -s packaging/tests -p 'test_*.py' -v
      - name: Verify legacy artifact contracts
        shell: pwsh
        run: ./packaging/check-artifact.tests.ps1

  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.14'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-25
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install pinned WiX v4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          ./packaging/windows/verify-wix-tool.ps1
      - name: Build canonical executable, ZIP and MSI set
        shell: pwsh
        run: ./packaging/windows/build-msi.ps1 -SkipNativeVerification
      - name: Verify MSI install, launch, upgrade and uninstall lifecycle
        shell: pwsh
        run: ./packaging/windows/verify-package.ps1 -DistDir dist/windows
      - name: Upload MSI lifecycle logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: FreeRemoteAccess-windows-msi-logs
          path: target/package/windows/logs
          if-no-files-found: warn
      - name: Upload verified canonical Windows set
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: FreeRemoteAccess-windows-x64
          path: dist/windows
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.14'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-25
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build and verify universal app archive and DMG
        run: ./packaging/macos/build-packages.sh
      - name: Upload verified canonical Mac OS set
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: FreeRemoteAccess-macos-universal
          path: dist/macos
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.14'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-25
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install native build and runtime dependencies
        run: sudo bash packaging/linux/install-ubuntu-jammy-snapshot.sh
      - name: Install pinned packaging tools
        run: |
          cargo install cargo-deb --version 3.7.0 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked
      - name: Build and verify AppDir archive, deb and AppImage
        run: ./packaging/linux/build-packages.sh
      - name: Verify GUI in clean Ubuntu 22.04 X11 and Wayland runtimes
        run: |
          mkdir -p target/package/linux/clean-runtime-logs
          python packaging/linux/fetch-ca-bootstrap.py --output-directory target/package/linux/bootstrap
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc \
            bash -euxo pipefail -c '
              test ! -s /etc/ssl/certs/ca-certificates.crt
              ca_deb="$(find target/package/linux/bootstrap -maxdepth 1 -type f -name "ca-certificates_*.deb" -print -quit)"
              test -n "$ca_deb"
              bash packaging/linux/install-ubuntu-jammy-snapshot.sh --ca-bootstrap-deb "$ca_deb"
              test -s /etc/ssl/certs/ca-certificates.crt
              deb_path="$(find dist/linux -maxdepth 1 -type f -name "*.deb" -print -quit)"
              test -n "$deb_path"
              test "$(find dist/linux -maxdepth 1 -type f -name "*.deb" | wc -l)" -eq 1
              dpkg -i "$deb_path"
              ./packaging/linux/verify-clean-runtime.sh /usr/bin/freeremoteaccess /workspace/target/package/linux/clean-runtime-logs
            '
      - name: Upload Linux clean-runtime logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: FreeRemoteAccess-linux-runtime-logs
          path: target/package/linux/clean-runtime-logs
          if-no-files-found: warn
      - name: Upload verified canonical Linux set
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: FreeRemoteAccess-linux-x86_64
          path: dist/linux
          if-no-files-found: error
