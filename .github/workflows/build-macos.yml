name: macOS package

on:
  workflow_dispatch:
    inputs:
      source_recipe:
        description: "显式选择固定 FFmpeg 来源（默认 upstream）"
        type: choice
        default: upstream
        options:
          - upstream
          - frd-h264dc-aarch64-v1
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/freeremotedesk-macos/**"
      - "assets/**"
      - "crates/**"
      - "packaging/macos/**"
      - "third_party/ffmpeg/8.1.2/**"
      - "tools/build-ffmpeg-macos.sh"
      - "tools/desktop-ffmpeg-source.py"
      - "tools/macos-ffmpeg-bundle.py"
      - "tools/ffmpeg-source-recipe.py"
      - "tools/tests/*macos*"
      - "tools/stage-macos-package.sh"
      - "tools/verify-macos-package.sh"
      - "tools/create-macos-icon.swift"
      - "third_party/ironrdp-connector-0.10.0/**"
      - ".github/workflows/build-macos.yml"
  push:
    branches:
      - "main"
      - "codex/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/freeremotedesk-macos/**"
      - "assets/**"
      - "crates/**"
      - "packaging/macos/**"
      - "third_party/ffmpeg/8.1.2/**"
      - "tools/build-ffmpeg-macos.sh"
      - "tools/desktop-ffmpeg-source.py"
      - "tools/macos-ffmpeg-bundle.py"
      - "tools/ffmpeg-source-recipe.py"
      - "tools/tests/*macos*"
      - "tools/stage-macos-package.sh"
      - "tools/verify-macos-package.sh"
      - "tools/create-macos-icon.swift"
      - "third_party/ironrdp-connector-0.10.0/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.workflow }}-${{ github.ref }}
  # 完成长耗时原生验证；同组仅保留最新待运行提交。
  cancel-in-progress: false

jobs:
  package:
    name: macOS ${{ matrix.architecture }} package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      FRD_FFMPEG_SOURCE_RECIPE: ${{ inputs.source_recipe || 'upstream' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            host_arch: arm64
            rust_target: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify pinned Rust toolchain
        shell: bash
        run: |
          test "$(rustc --version | cut -d' ' -f2)" = "1.96.0"
          test "$(uname -m)" = "${{ matrix.host_arch }}"
          rustup target add "${{ matrix.rust_target }}"
          rustc --target "${{ matrix.rust_target }}" --version --verbose

      - name: Run focused decoder and protocol tests
        shell: bash
        run: >-
          cargo test --locked
          -p frd-media-api
          -p frd-video-ffmpeg
          -p frd-video-ffmpeg-plugin
          -p frd-protocol-rdp
          -p freeremotedesk-macos

      - name: Run ARM64 ClearCodec, NSCodec and Progressive parity and bounded benchmark
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          printf 'ClearCodec runtime target=%s host=%s\n' "${{ matrix.rust_target }}" "$(uname -m)"
          cargo test --locked --target "${{ matrix.rust_target }}" -p frd-protocol-rdp clearcodec
          cargo test --locked --release --target "${{ matrix.rust_target }}" -p frd-protocol-rdp bounded_decode_benchmark -- --ignored --nocapture --test-threads=1
          cargo test --locked --target "${{ matrix.rust_target }}" -p frd-protocol-rdp progressive
          cargo test --locked --release --target "${{ matrix.rust_target }}" -p frd-protocol-rdp benchmark_progressive_native_tile -- --ignored --nocapture --test-threads=1

      - name: Build exact FFmpeg bundle and native fixtures
        shell: bash
        env:
          FRD_MACOS_ARCH: ${{ matrix.architecture }}
          FRD_FFMPEG_BUILD_ROOT: ${{ github.workspace }}/target/ffmpeg-macos-${{ matrix.architecture }}
          FRD_FFMPEG_RUN_NATIVE_TESTS: "1"
        run: bash tools/build-ffmpeg-macos.sh

      - name: Verify fixed recipe, Mach-O and corresponding source gates
        shell: bash
        env:
          FRD_FFMPEG_TEST_ARCHIVE: ${{ github.workspace }}/target/ffmpeg-macos-${{ matrix.architecture }}/ffmpeg-8.1.2.tar.xz
        run: |
          python3 -m unittest discover -s tools/tests -p test_macos_ffmpeg_recipe.py -v
          bash tools/tests/macos-signing-config.sh

      - name: Verify macOS package license rejection fixtures
        shell: bash
        run: bash tools/tests/macos-package-licenses.sh

      - name: Stage and verify macOS application
        shell: bash
        env:
          FRD_MACOS_ARCH: ${{ matrix.architecture }}
          FRD_FFMPEG_BUILD_ROOT: ${{ github.workspace }}/target/ffmpeg-macos-${{ matrix.architecture }}
        run: bash tools/stage-macos-package.sh release

      - name: Stage corresponding FFmpeg source evidence
        shell: bash
        run: |
          source_root="target/ffmpeg-macos-${{ matrix.architecture }}"
          release_root="target/release-assets/ffmpeg-8.1.2-${{ matrix.architecture }}"
          test -f "$source_root/ffmpeg-8.1.2.tar.xz"
          actual_hash="$(shasum -a 256 "$source_root/ffmpeg-8.1.2.tar.xz" | awk '{print $1}')"
          test "$actual_hash" = "464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c"
          mkdir -p "$release_root"
          source_asset="$(python3 tools/desktop-ffmpeg-source.py asset-name --source-recipe "$FRD_FFMPEG_SOURCE_RECIPE")"
          if [[ "$FRD_FFMPEG_SOURCE_RECIPE" == upstream ]]; then
            python3 tools/desktop-ffmpeg-source.py asset --archive "$source_root/ffmpeg-8.1.2.tar.xz" \
              --output "$release_root/$source_asset" --source-recipe upstream
            # 原五文件 bundle NOTICE 中的原 archive 下载入口仍保留。
            cp "$source_root/ffmpeg-8.1.2.tar.xz" "$release_root/"
          else
            cp "$source_root/bundle/$source_asset" "$release_root/"
          fi
          python3 tools/desktop-ffmpeg-source.py verify-asset --archive "$source_root/ffmpeg-8.1.2.tar.xz" \
            --output "$release_root/$source_asset" --source-recipe "$FRD_FFMPEG_SOURCE_RECIPE"

      - name: Upload exact macOS application package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeremotedesk-macos-${{ matrix.architecture }}
          path: target/macos/release/FreeRemoteDesk.app
          if-no-files-found: error

      - name: Upload corresponding FFmpeg source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeremotedesk-ffmpeg-8.1.2-source-${{ matrix.architecture }}
          path: target/release-assets/ffmpeg-8.1.2-${{ matrix.architecture }}
          if-no-files-found: error
